plugins {
    id 'com.diffplug.spotless' version '7.0.2' apply false
    id 'thingworx.git-hooks'
}

allprojects {
    group = 'io.github.us-ignite'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Install the repository-managed Git hooks.'
    doLast {
        logger.lifecycle('Git hooks are installed during Gradle settings evaluation.')
    }
}
