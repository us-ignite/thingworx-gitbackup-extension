plugins {
    id 'thingworx.base'
    id 'thingworx.git-hooks'
}

// Ensure every subproject exposes the aggregate aliases the root uses.
// Only custom names are registered here — never plugin-provided lifecycle
// names (build/test/check/clean/assemble/eclipse), which the plugins own.
subprojects {
    afterEvaluate { proj ->
        if (!proj.tasks.findByName('buildAll') && proj.tasks.findByName('build') != null) {
            proj.tasks.register('buildAll') {
                group = 'build'
                description = "Build all variants for ${proj.path} (alias for build)"
                dependsOn proj.tasks.findByName('build')
            }
        }
        if (!proj.tasks.findByName('testAll') && proj.tasks.findByName('test') != null) {
            proj.tasks.register('testAll') {
                group = 'verification'
                description = "Run all tests for ${proj.path} (alias for test)"
                dependsOn proj.tasks.findByName('test')
            }
        }
    }
}

tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Install the repository-managed Git hooks.'
    doLast {
        logger.lifecycle('Git hooks are installed during Gradle settings evaluation.')
    }
}

// Root aggregators use task-path string dependencies (configuration-cache safe).
// NOTE: the root deliberately declares NO task with a plugin-provided lifecycle
// name (clean/assemble/build/check/test/eclipse/cleanEclipse) — those belong to
// the plugins, and shadowing them breaks IDE/Buildship phased syncs. The
// workspace-wide commands are buildAll / testAll / checkAll / cleanAll /
// eclipseAll below; per-project lifecycle tasks (e.g. :apps/...:build) are
// invoked by path when needed.
tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean all subproject build outputs and image staging directories'
    dependsOn ':libraries:thingworx-dap:clean'
    dependsOn ':libraries:thingworx-dap-runtime:clean'
    dependsOn ':libraries:thingworx-testcontainers:clean'
    dependsOn ':examples:thingworx-dap-usage:clean'
    dependsOn ':examples:thingworx-operator-deployments:clean'
    dependsOn ':apps:thingworx-jgit-extension:clean'
    dependsOn ':apps:thingworx-operator:clean'
    dependsOn ':images:platform:cleanVendor'
    dependsOn ':images:security-tool:cleanVendor'
    dependsOn ':images:connection-server:cleanVendor'
    dependsOn ':images:thingworx-operator:clean'
}

tasks.register('eclipseAll') {
    group = 'ide'
    description = 'Generate Eclipse metadata for all Eclipse-enabled subprojects'
    dependsOn ':libraries:thingworx-dap:eclipse'
    dependsOn ':libraries:thingworx-dap-runtime:eclipse'
    dependsOn ':libraries:thingworx-testcontainers:eclipse'
    dependsOn ':examples:thingworx-dap-usage:eclipse'
    dependsOn ':apps:thingworx-jgit-extension:v96:eclipse'
    dependsOn ':apps:thingworx-jgit-extension:v97:eclipse'
    dependsOn ':apps:thingworx-jgit-extension:v100:eclipse'
    dependsOn ':apps:thingworx-jgit-extension:v101:eclipse'
    dependsOn ':apps:thingworx-operator:eclipse'
}

tasks.register('checkAll') {
    group = 'verification'
    description = 'Run all checks for all versions and subprojects'
    dependsOn ':apps:thingworx-jgit-extension:checkAll'
    dependsOn ':apps:thingworx-operator:check'
    dependsOn tasks.named('chartTest')
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build all subprojects (libs, apps, images, charts)'
    dependsOn ':libraries:thingworx-dap:build'
    dependsOn ':libraries:thingworx-dap-runtime:build'
    dependsOn ':apps:thingworx-jgit-extension:buildAll'
    dependsOn ':apps:thingworx-operator:build'
    dependsOn ':images:platform:buildAll'
    dependsOn ':images:security-tool:buildAll'
    dependsOn ':images:connection-server:buildAll'
    dependsOn ':images:thingworx-operator:buildAll'
    dependsOn tasks.named('chartBuild')
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Run all tests for all subprojects (libs, apps, images, charts)'
    dependsOn ':libraries:thingworx-testcontainers:testAll'
    dependsOn ':apps:thingworx-jgit-extension:testAll'
    dependsOn ':apps:thingworx-operator:testAll'
    dependsOn tasks.named('chartTest')
}

tasks.register('chartTest') {
    group = 'verification'
    description = 'Lint all Helm charts (charts/*) plus CEL validation via helm-unittest / kubeconform mock when available'
    dependsOn ':apps:thingworx-operator:test'
    def localRootDir = rootDir
    doLast {
        def chartsDir = new File(localRootDir, 'charts')
        if (!chartsDir.exists()) {
            println "No charts directory"
            return
        }
        chartsDir.eachDir { chart ->
            println "Linting chart ${chart.name}..."
            def proc = new ProcessBuilder('helm', 'lint', chart.absolutePath).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("helm lint failed for ${chart.name}")

            println "Templating chart ${chart.name}..."
            def tpl = new ProcessBuilder('helm', 'template', chart.name, chart.absolutePath).inheritIO().start()
            if (tpl.waitFor() != 0) throw new GradleException("helm template failed for ${chart.name}")

            def unittestCheck = new ProcessBuilder('helm', 'plugin', 'list').redirectOutput(ProcessBuilder.Redirect.PIPE).start()
            unittestCheck.waitFor()
            String pluginList = ""
            try { pluginList = new String(unittestCheck.inputStream.readAllBytes()) } catch (Exception ignored) {}
            if (pluginList.contains("unittest")) {
                println "Running helm unittest for ${chart.name} (CEL validations)..."
                def ut = new ProcessBuilder('helm', 'unittest', chart.absolutePath).inheritIO().start()
                if (ut.waitFor() != 0) throw new GradleException("helm unittest failed for ${chart.name}")
            } else {
                println "helm unittest plugin not installed — skipping unittest for ${chart.name} (CEL covered by Java mock tests)"
            }

            def kcCheck = new ProcessBuilder('sh', '-c', 'command -v kubeconform >/dev/null 2>&1 && echo found || echo missing').redirectOutput(ProcessBuilder.Redirect.PIPE).start()
            kcCheck.waitFor()
            String kcStatus = ""
            try { kcStatus = new String(kcCheck.inputStream.readAllBytes()).trim() } catch (Exception ignored) {}
            if (kcStatus == "found") {
                println "Running kubeconform for ${chart.name}..."
                def rendered = new ProcessBuilder('helm', 'template', chart.name, chart.absolutePath)
                    .redirectOutput(ProcessBuilder.Redirect.PIPE)
                    .redirectError(ProcessBuilder.Redirect.INHERIT)
                    .start()
                if (rendered.waitFor() != 0) throw new GradleException("helm template failed for ${chart.name}")
                def yaml = rendered.inputStream.readAllBytes()
                def kc = new ProcessBuilder('sh', '-c', 'kubeconform -summary -verbose')
                    .redirectInput(ProcessBuilder.Redirect.PIPE)
                    .redirectOutput(ProcessBuilder.Redirect.INHERIT)
                    .redirectError(ProcessBuilder.Redirect.INHERIT)
                    .start()
                try {
                    kc.outputStream.write(yaml)
                    kc.outputStream.close()
                } catch (IOException e) {
                    kc.destroyForcibly()
                    throw new GradleException("Failed to send rendered manifests to kubeconform for ${chart.name}", e)
                }
                if (kc.waitFor() != 0) throw new GradleException("kubeconform failed for ${chart.name}")
            } else {
                println "kubeconform not installed — skipping (CEL covered by Java tests)"
            }
        }
    }
}

tasks.register('chartBuild') {
    group = 'build'
    description = 'Template all Helm charts (charts/*)'
    def localRootDir = rootDir
    doLast {
        def chartsDir = new File(localRootDir, 'charts')
        chartsDir.eachDir { chart ->
            println "Templating chart ${chart.name}..."
            def proc = new ProcessBuilder('helm', 'template', chart.name, chart.absolutePath).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("helm template failed for ${chart.name}")
        }
    }
}

tasks.register('verifyVersions') {
    group = 'verification'
    description = 'Verify thingworx-operator version consistency: .version, Chart.yaml, images/build.gradle'
    def localRootDir = rootDir
    doLast {
        def operatorVersionFile = new File(localRootDir, 'apps/thingworx-operator/.version')
        def chartDotVersionFile = new File(localRootDir, 'charts/thingworx-operator/.version')
        def chartYaml = new File(localRootDir, 'charts/thingworx-operator/Chart.yaml')

        if (!operatorVersionFile.exists()) throw new GradleException("Missing canonical version file: ${operatorVersionFile}")
        String canonical = operatorVersionFile.text.trim()
        if (!canonical.matches(/^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/)) {
            throw new GradleException("Canonical version '$canonical' is not SemVer")
        }
        println "Canonical operator version: ${canonical} (from apps/thingworx-operator/.version)"

        List<String> errors = []

        if (chartDotVersionFile.exists()) {
            String v = chartDotVersionFile.text.trim()
            println "charts/thingworx-operator/.version: ${v}"
            if (v != canonical) errors << "charts/thingworx-operator/.version ($v) != canonical ($canonical)"
        } else {
            errors << "Missing charts/thingworx-operator/.version"
        }

        if (chartYaml.exists()) {
            String yamlText = chartYaml.text
            def vMatch = (yamlText =~ /(?m)^version:\s*([^\s#]+)/)
            def avMatch = (yamlText =~ /(?m)^appVersion:\s*"?([^"\s#]+)"?/)
            String chartVer = vMatch.find() ? vMatch.group(1).trim() : null
            String appVer = avMatch.find() ? avMatch.group(1).trim().replaceAll(/^"|"$/, '') : null
            println "charts/thingworx-operator/Chart.yaml version: ${chartVer}, appVersion: ${appVer}"
            if (chartVer != canonical) errors << "charts/thingworx-operator/Chart.yaml version ($chartVer) != canonical ($canonical)"
            if (appVer != canonical) errors << "charts/thingworx-operator/Chart.yaml appVersion ($appVer) != canonical ($canonical)"
        } else {
            errors << "Missing charts/thingworx-operator/Chart.yaml"
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Version mismatch detected:\n - " + errors.join("\n - ") + "\nCanonical version is $canonical (apps/thingworx-operator/.version).")
        }
        println "verifyVersions: all operator version sources agree on ${canonical} ✓"
    }
}
