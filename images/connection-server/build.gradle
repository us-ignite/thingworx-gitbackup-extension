plugins {
    id 'thingworx.base'
    id 'thingworx.docker'
}

def ALL_TWX = [
    '9.6': [
        cxServerDockerFiles: 'MED-61352-CD-096_9-6-0_ThingWorx-Connection-Server-DockerFiles-9-2-2-2.tar.gz',
        cxVersion: '9.2.2.2',
        appArchive: 'connection-server-9.2.2.2.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '9.7': [
        cxServerDockerFiles: 'MED-61352-CD-097_9-7-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '10.0': [
        cxServerDockerFiles: 'MED-61352-CD-100_10-0-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '10.1': [
        cxServerDockerFiles: 'MED-61352-CD-101_10-1-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
]

def ALL_CX_BASE = [
    // NOTE: the vendor build.sh parses a version out of this filename
    // ([0-9]+u[0-9]+ or X.Y.Z), so it must stay version-pinned. The generic
    // 'latest' download name (corretto-11-x64-linux-jdk.tar.gz) has no
    // parseable version and fails the build with "Unable to determine Java
    // version from archive".
    '9.2.2.2': [javaArchive: 'amazon-corretto-11.0.32.10.1-linux-x64.tar.gz', baseImage: 'ubuntu:22.04'],
    '9.3.0.4': [javaArchive: 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz', baseImage: 'ubuntu:22.04'],
]

// Shared via thingworx.docker plugin (single implementation in build-logic).
def IMG_BUILD_DIR = project.ext.imgBuildDir
def IMG_VENDOR_DIR = project.ext.imgVendorDir
def requireVendorArchive = project.ext.requireVendorArchive

tasks.register('decryptVendor') {
    description = 'Stage vendor connection-server DockerFiles for all TW versions'
    group = 'images'
    def localBuildDir = IMG_BUILD_DIR
    def localVendorDir = IMG_VENDOR_DIR
    def localTwx = ALL_TWX
    def localRequire = requireVendorArchive
    doLast {
        localTwx.each { twxVersion, cfg ->
            def dest = new File("${localBuildDir}/vendor-extracted/connection-server/${twxVersion}")
            dest.mkdirs()
            // Copy both vendor archives from the (filter-decrypted) vendor dir.
            [cfg.cxServerDockerFiles, cfg.appArchive].each { name ->
                def target = new File(dest, name)
                if (!target.isFile()) {
                    def source = localRequire(new File(localVendorDir, name))
                    source.withInputStream { input -> target.withOutputStream { output -> input.transferTo(output) } }
                }
            }
            if (new File(dest, 'dockerfiles').isDirectory() && new File(dest, cfg.appArchive).isFile()) {
                println "Connection-server DockerFiles for ${twxVersion} already extracted"
                return
            }
            println "Unpacking connection-server DockerFiles for TW ${twxVersion}..."
            def unpack = new ProcessBuilder('tar', 'xzf', cfg.cxServerDockerFiles).directory(dest).inheritIO().start()
            if (unpack.waitFor() != 0) throw new GradleException("Could not unpack ${cfg.cxServerDockerFiles}")
        }
    }
}

tasks.register('fetchJdk') {
    description = 'Fetch JDK for each TW version into connection-server staging'
    group = 'images'
    dependsOn 'decryptVendor'
    def localBuildDir = IMG_BUILD_DIR
    def localTwx = ALL_TWX
    def localCxBase = ALL_CX_BASE
    doLast {
        localTwx.each { twxVersion, cfg ->
            def baseCfg = localCxBase[cfg.cxVersion]
            def archiveName = baseCfg.javaArchive
            def workDir = new File("${localBuildDir}/vendor-extracted/connection-server/${twxVersion}")
            def installer = new File(workDir, cfg.appArchive)
            if (!installer.isFile()) {
                throw new GradleException("Missing required Connection Server installer ${cfg.appArchive} for TW ${twxVersion}. Download it from PTC Support into vendor/ (see twx-file filter).")
            }
            def stage = new File(workDir, 'staging')
            def stagedInstaller = new File(stage, cfg.appArchive)
            stage.mkdirs()
            if (!stagedInstaller.isFile() || stagedInstaller.length() != installer.length()) {
                installer.withInputStream { input -> stagedInstaller.withOutputStream { output -> input.transferTo(output) } }
            }
            def jdkFile = new File(stage, archiveName)
            if (jdkFile.exists()) {
                println "JDK for connection-server ${twxVersion} already present"
                return
            }
            stage.mkdirs()
            // Pinned (not `latest`): the staged filename must keep its version
            // so the vendor build.sh can parse JAVA_VERSION from it.
            def url = archiveName.startsWith('amazon-corretto-11')
                ? 'https://corretto.aws/downloads/resources/11.0.32.10.1/amazon-corretto-11.0.32.10.1-linux-x64.tar.gz'
                : 'https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz'
            println "Downloading JDK for connection-server TW ${twxVersion}: ${url}"
            def proc = new ProcessBuilder('curl', '-fsSL', '-o', jdkFile.absolutePath, url).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("curl failed for ${url}")
        }
    }
}

['9.2.2.2', '9.3.0.4'].each { cxVersion ->
    def capturedCxVersion = cxVersion
    def localBuildDir = IMG_BUILD_DIR
    def localCxBase = ALL_CX_BASE
    def localTwx = ALL_TWX

    tasks.register("buildCxServerBase_${capturedCxVersion.replace('.', '_')}") {
        description = "Build cxserver-base image for CX version ${capturedCxVersion}"
        group = 'images'
        dependsOn 'fetchJdk'
        doLast {
            def cfg = localCxBase[capturedCxVersion]
            def twxVersion = localTwx.find { it.value.cxVersion == capturedCxVersion }?.key
            if (!twxVersion) throw new GradleException("No TW version found for cxVersion ${capturedCxVersion}")
            def workDir = new File("${localBuildDir}/vendor-extracted/connection-server/${twxVersion}")
            def required = new File(workDir, "staging/${cfg.javaArchive}")
            if (!required.isFile()) {
                throw new GradleException("Missing required JDK archive for cxserver-base ${capturedCxVersion}: ${required}")
            }
            def buildEnv = new File(workDir, "build.env")
            if (buildEnv.exists()) {
                buildEnv.text = buildEnv.text
                    .replaceAll(/(?m)^BASE_OS_IMAGE=.*/, "BASE_OS_IMAGE=${cfg.baseImage}")
                    .replaceAll(/(?m)^JAVA_ARCHIVE=.*/, "JAVA_ARCHIVE=${cfg.javaArchive}")
                    .replaceAll(/(?m)^APP_VERSION=.*/, "APP_VERSION=${capturedCxVersion}")
            }
            println "Building cxserver-base ${capturedCxVersion}..."
            new ProcessBuilder('bash', '-c', "sed -i 's/ --network=host//g; s/--pull=false//g; s/docker build/docker build --pull=false --network=host/g' build.sh").directory(workDir).inheritIO().start().waitFor()
            def attempt = 0
            def success = false
            while (attempt < 3 && !success) {
                attempt++
                if (attempt > 1) println "Retrying cxserver-base ${capturedCxVersion} attempt ${attempt}/3 ..."
                def proc = new ProcessBuilder('bash', 'build.sh').directory(workDir).redirectErrorStream(true).start()
                proc.inputStream.eachLine { line -> println "  [build] ${line}" }
                if (proc.waitFor() == 0) success = true
                else if (attempt < 3) Thread.sleep(5000)
            }
            if (!success) throw new GradleException("build.sh failed for cxserver-base ${capturedCxVersion} after 3 attempts")
            def dockerTag = project.ext.dockerTag
            dockerTag("thingworx/cxserver-base:cxserver-${capturedCxVersion}", "ghcr.io/us-ignite/thingworx-cxserver-base:${capturedCxVersion}")
            dockerTag("thingworx/cxserver-base:cxserver-${capturedCxVersion}", 'ghcr.io/us-ignite/thingworx-cxserver-base:latest')
        }
    }
}

ALL_TWX.each { twxVersion, cfg ->
    def capturedVer = twxVersion
    def capturedCfg = cfg
    def localBuildDir = IMG_BUILD_DIR
    def localCxBase = ALL_CX_BASE

    tasks.register("buildCxServer_${capturedVer}") {
        description = "Build cxserver image for TW ${capturedVer} (CX ${capturedCfg.cxVersion})"
        group = 'images'
        dependsOn "buildCxServerBase_${capturedCfg.cxVersion.replace('.', '_')}"
        doLast {
            def workDir = new File("${localBuildDir}/vendor-extracted/connection-server/${capturedVer}")
            def buildEnv = new File(workDir, "build.env")
            if (buildEnv.exists()) {
                // Use JDK per CX major version (e.g., 9.2.x -> Java 11, 9.3.x -> Java 21) regardless of what vendor build.env shipped with.
                def baseCfg = localCxBase[capturedCfg.cxVersion]
                def javaArchive = baseCfg.javaArchive
                buildEnv.text = buildEnv.text
                    .replaceAll(/(?m)^BASE_OS_IMAGE=.*/, "BASE_OS_IMAGE=${capturedCfg.baseImage}")
                    .replaceAll(/(?m)^JAVA_ARCHIVE=.*/, "JAVA_ARCHIVE=${javaArchive}")
                    .replaceAll(/(?m)^APP_VERSION=.*/, "APP_VERSION=${capturedCfg.cxVersion}")
            }
            println "Building cxserver for TW ${capturedVer} (CX ${capturedCfg.cxVersion})..."
            def required = new File(workDir, "staging/${capturedCfg.appArchive}")
            if (!required.isFile()) {
                throw new GradleException("Missing required Connection Server installer for TW ${capturedVer}: ${required}")
            }
            new ProcessBuilder('bash', '-c', "sed -i 's/ --network=host//g; s/--pull=false//g; s/docker build/docker build --pull=false --network=host/g' build.sh").directory(workDir).inheritIO().start().waitFor()
            def attempt = 0
            def success = false
            while (attempt < 3 && !success) {
                attempt++
                if (attempt > 1) println "Retrying cxserver ${capturedVer} attempt ${attempt}/3 ..."
                def proc = new ProcessBuilder('bash', 'build.sh').directory(workDir).redirectErrorStream(true).start()
                proc.inputStream.eachLine { line -> println "  [build] ${line}" }
                if (proc.waitFor() == 0) success = true
                else if (attempt < 3) Thread.sleep(5000)
            }
            if (!success) throw new GradleException("build.sh failed for cxserver ${capturedVer} after 3 attempts")
            def dockerTag = project.ext.dockerTag
            dockerTag("thingworx/cxserver-twx:cxserver-${capturedCfg.cxVersion}", "ghcr.io/us-ignite/thingworx-cxserver:${capturedVer}")
            dockerTag("thingworx/cxserver-twx:cxserver-${capturedCfg.cxVersion}", 'ghcr.io/us-ignite/thingworx-cxserver:latest')
        }
    }
}

tasks.register('buildAll') {
    description = 'Build all cxserver-base and cxserver images'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { twxVersion -> "buildCxServer_${twxVersion}" }
}

tasks.register('buildAllBase') {
    description = 'Build all cxserver-base images'
    group = 'images'
    dependsOn 'buildCxServerBase_9_2_2_2'
    dependsOn 'buildCxServerBase_9_3_0_4'
}

tasks.register('pushAll') {
    description = 'Push all cxserver images to ghcr.io'
    group = 'publishing'
    dependsOn 'buildAll'
    doLast {
        ['9.2.2.2', '9.3.0.4'].each { cxVersion ->
            def p = new ProcessBuilder('docker', 'push', "ghcr.io/us-ignite/thingworx-cxserver-base:${cxVersion}").inheritIO().start()
            if (p.waitFor() != 0) throw new GradleException("docker push failed")
        }
        def p0 = new ProcessBuilder('docker', 'push', 'ghcr.io/us-ignite/thingworx-cxserver-base:latest').inheritIO().start()
        if (p0.waitFor() != 0) throw new GradleException("docker push failed")
        def localTwx = ALL_TWX
        localTwx.each { twxVersion, cfg ->
            def p = new ProcessBuilder('docker', 'push', "ghcr.io/us-ignite/thingworx-cxserver:${twxVersion}").inheritIO().start()
            if (p.waitFor() != 0) throw new GradleException("docker push failed")
        }
        def p1 = new ProcessBuilder('docker', 'push', 'ghcr.io/us-ignite/thingworx-cxserver:latest').inheritIO().start()
        if (p1.waitFor() != 0) throw new GradleException("docker push failed")
    }
}

