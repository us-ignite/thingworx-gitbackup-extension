import thingworx.docker.DockerPush
import thingworx.docker.ExtractVendorArchive
import thingworx.docker.VendorBuildScript
import thingworx.tasks.StageFile
import thingworx.tasks.VerifiedDownload

plugins {
    id 'thingworx.docker'
}

def ALL_TWX = [
    '9.6': [
        cxServerDockerFiles: 'MED-61352-CD-096_9-6-0_ThingWorx-Connection-Server-DockerFiles-9-2-2-2.tar.gz',
        cxVersion: '9.2.2.2',
        appArchive: 'connection-server-9.2.2.2.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '9.7': [
        cxServerDockerFiles: 'MED-61352-CD-097_9-7-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '10.0': [
        cxServerDockerFiles: 'MED-61352-CD-100_10-0-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
    '10.1': [
        cxServerDockerFiles: 'MED-61352-CD-101_10-1-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
    // No 10.2-specific Connection Server release; 9.3.0.4 is the latest.
    '10.2': [
        cxServerDockerFiles: 'MED-61352-CD-101_10-1-0_ThingWorx-Connection-Server-DockerFiles-9-3-0-4.tar.gz',
        cxVersion: '9.3.0.4',
        appArchive: 'connection-server-9.3.0.4.zip',
        baseImage: 'ubuntu:22.04',
    ],
]

def ALL_CX_BASE = [
    // NOTE: the vendor build.sh parses a version out of this filename
    // ([0-9]+u[0-9]+ or X.Y.Z), so it must stay version-pinned. The generic
    // 'latest' download name (corretto-11-x64-linux-jdk.tar.gz) has no
    // parseable version and fails the build with "Unable to determine Java
    // version from archive".
    '9.2.2.2': [javaArchive: 'amazon-corretto-11.0.32.10.1-linux-x64.tar.gz', baseImage: 'ubuntu:22.04',
                javaUrl: 'https://corretto.aws/downloads/resources/11.0.32.10.1/amazon-corretto-11.0.32.10.1-linux-x64.tar.gz'],
    '9.3.0.4': [javaArchive: 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz', baseImage: 'ubuntu:22.04',
                javaUrl: 'https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz'],
]

def BASE_IMAGE = 'ghcr.io/us-ignite/thingworx-cxserver-base'
def IMAGE = 'ghcr.io/us-ignite/thingworx-cxserver'

def images = thingworxImages

ALL_TWX.each { ver, cfg ->
    def context = images.context('connection-server', ver)
    def staging = context.map { it.dir('staging') }
    def base = ALL_CX_BASE[cfg.cxVersion]

    tasks.register("decryptVendor_${ver}", ExtractVendorArchive) {
        description = "Stage vendor connection-server DockerFiles for TW ${ver}"
        archive = images.vendorFile(cfg.cxServerDockerFiles)
        destination = context
    }
    tasks.register("stageInstaller_${ver}", StageFile) {
        description = "Stage the Connection Server installer for TW ${ver}"
        dependsOn "decryptVendor_${ver}"
        source = images.vendorFile(cfg.appArchive)
        destination = staging.map { it.file(cfg.appArchive) }
        requirePlaintext = true
    }
    // Pinned filename: the vendor build.sh parses JAVA_VERSION out of it.
    tasks.register("fetchJdk_${ver}", VerifiedDownload) {
        description = "Fetch the JDK into connection-server staging for TW ${ver}"
        group = 'images'
        dependsOn "decryptVendor_${ver}"
        url = base.javaUrl
        outputFile = staging.map { it.file(base.javaArchive) }
    }
    tasks.register("buildCxServer_${ver}", VendorBuildScript) {
        description = "Build cxserver image for TW ${ver} (CX ${cfg.cxVersion})"
        dependsOn "buildCxServerBase_${cfg.cxVersion.replace('.', '_')}", "stageInstaller_${ver}", "fetchJdk_${ver}"
        displayName = "cxserver for TW ${ver} (CX ${cfg.cxVersion})"
        workDir = context
        // JDK per CX major version (9.2.x -> Java 11, 9.3.x -> Java 21) regardless of the vendor build.env.
        envOverrides = [BASE_OS_IMAGE: cfg.baseImage, JAVA_ARCHIVE: base.javaArchive, APP_VERSION: cfg.cxVersion]
        requiredFiles = ["staging/${cfg.appArchive}".toString()]
        imageTags = [
            ("${IMAGE}:${ver}".toString()): "thingworx/cxserver-twx:cxserver-${cfg.cxVersion}".toString(),
            ("${IMAGE}:latest".toString()): "thingworx/cxserver-twx:cxserver-${cfg.cxVersion}".toString(),
        ]
    }
}

ALL_CX_BASE.each { cxVersion, base ->
    // Built in the context of the first ThingWorx version that ships this CX version.
    def ver = ALL_TWX.find { it.value.cxVersion == cxVersion }?.key
    if (!ver) throw new GradleException("No TW version found for cxVersion ${cxVersion}")
    tasks.register("buildCxServerBase_${cxVersion.replace('.', '_')}", VendorBuildScript) {
        description = "Build cxserver-base image for CX version ${cxVersion}"
        dependsOn "stageInstaller_${ver}", "fetchJdk_${ver}"
        displayName = "cxserver-base ${cxVersion}"
        workDir = images.context('connection-server', ver)
        envOverrides = [BASE_OS_IMAGE: base.baseImage, JAVA_ARCHIVE: base.javaArchive, APP_VERSION: cxVersion]
        requiredFiles = ["staging/${base.javaArchive}".toString()]
        imageTags = [
            ("${BASE_IMAGE}:${cxVersion}".toString()): "thingworx/cxserver-base:cxserver-${cxVersion}".toString(),
            ("${BASE_IMAGE}:latest".toString())    : "thingworx/cxserver-base:cxserver-${cxVersion}".toString(),
        ]
    }
}

tasks.register('decryptVendor') {
    description = 'Stage vendor connection-server DockerFiles for all TW versions'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "decryptVendor_${it}" }
}

tasks.register('fetchJdk') {
    description = 'Fetch JDK for each TW version into connection-server staging'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { ["fetchJdk_${it}", "stageInstaller_${it}"] }.flatten()
}

tasks.register('buildAll') {
    description = 'Build all cxserver-base and cxserver images'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "buildCxServer_${it}" }
}

tasks.register('buildAllBase') {
    description = 'Build all cxserver-base images'
    group = 'images'
    dependsOn ALL_CX_BASE.keySet().collect { "buildCxServerBase_${it.replace('.', '_')}" }
}

tasks.register('pushAll', DockerPush) {
    description = 'Push all cxserver images to ghcr.io'
    dependsOn 'buildAll'
    tags = (ALL_CX_BASE.keySet() + ['latest']).collect { "${BASE_IMAGE}:${it}".toString() } +
            (ALL_TWX.keySet() + ['latest']).collect { "${IMAGE}:${it}".toString() }
}
