import thingworx.docker.DockerBuild
import thingworx.docker.DockerPush
import thingworx.docker.ExtractVendorArchive
import thingworx.tasks.StageFile
import thingworx.tasks.VerifiedDownload

plugins {
    id 'thingworx.docker'
}

def ALL_TWX = [
    '9.6': [
        securityDockerFiles: 'MED-61282-CD-096_9-6-9_Security-Management-Tool-DockerFiles-1-7-2-309.gz',
        versionTag: '9.6.9',
        baseImage: 'ubuntu:22.04',
        securityToolArchive: 'security-common-cli-1.7.2.309.tar.gz',
        templateProcessorArchive: 'template-processor-13.0.1.51-application.tar.gz',
        jdk: 'corretto11',
    ],
    '9.7': [
        securityDockerFiles: 'MED-61282-CD-097_9-7-3_Security-Management-Tool-DockerFiles-1-6-1-217.gz',
        versionTag: '9.7.9',
        baseImage: 'ubuntu:22.04',
        securityToolArchive: 'security-common-cli-1.6.1.217.tar.gz',
        templateProcessorArchive: 'template-processor-12.4.0.34-application.tar.gz',
        jdk: 'corretto21',
    ],
    '10.0': [
        securityDockerFiles: 'MED-61282-CD-100_10-0-4_Security-Management-Tool-DockerFiles-1-7-2-309.gz',
        versionTag: '10.0.9',
        baseImage: 'ubuntu:22.04',
        securityToolArchive: 'security-common-cli-1.7.2.309.tar.gz',
        templateProcessorArchive: 'template-processor-13.0.1.51-application.tar.gz',
        jdk: 'corretto21',
    ],
    '10.1': [
        securityDockerFiles: 'MED-61282-CD-101_10-1-2_Security-Management-Tool-DockerFiles-1-7-2-309.gz',
        versionTag: '10.1.2',
        baseImage: 'ubuntu:24.04',
        securityToolArchive: 'security-common-cli-1.7.2.309.tar.gz',
        templateProcessorArchive: 'template-processor-13.0.1.51-application.tar.gz',
        jdk: 'corretto21',
    ],
    '10.2': [
        securityDockerFiles: 'MED-61282-CD-102_10-2-1_Security-Management-Tool-DockerFiles-1-7-2-314.gz',
        versionTag: '10.2.1',
        baseImage: 'ubuntu:24.04',
        securityToolArchive: 'security-common-cli-1.7.2.314.tar.gz',
        templateProcessorArchive: 'template-processor-13.0.1.59-application.tar.gz',
        jdk: 'corretto21',
    ],
]

def JDKS = [
    corretto11: [archive: 'corretto-11-x64-linux-jdk.tar.gz',
                 url: 'https://corretto.aws/downloads/latest/amazon-corretto-11-x64-linux-jdk.tar.gz'],
    corretto21: [archive: 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz',
                 url: 'https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz'],
]
def IMAGE = 'ghcr.io/us-ignite/thingworx/security-tool'

def images = thingworxImages
def overrideTasks = [templateProcessor: [], securityTool: []]

ALL_TWX.each { ver, cfg ->
    def context = images.context('security-tool', ver)
    def staging = context.map { it.dir('staging') }
    def jdk = JDKS[cfg.jdk]

    tasks.register("decryptVendor_${ver}", ExtractVendorArchive) {
        description = "Stage vendor security-tool DockerFiles for TW ${ver}"
        archive = images.vendorFile(cfg.securityDockerFiles)
        destination = context
    }

    tasks.register("fetchJdk_${ver}", VerifiedDownload) {
        description = "Fetch the Corretto JDK into security-tool staging for TW ${ver}"
        group = 'images'
        dependsOn "decryptVendor_${ver}"
        url = jdk.url
        outputFile = staging.map { it.file(jdk.archive) }
    }

    // The DockerFiles archive ships both archives in staging/. A copy in vendor/ overrides it.
    [templateProcessor: cfg.templateProcessorArchive, securityTool: cfg.securityToolArchive].each { kind, archiveName ->
        if (!images.vendorFile(archiveName).get().asFile.isFile()) return
        def name = "${kind}Override_${ver}"
        overrideTasks[kind] << name
        tasks.register(name, StageFile) {
            description = "Stage vendor/${archiveName} over the archive's copy for TW ${ver}"
            dependsOn "decryptVendor_${ver}"
            source = images.vendorFile(archiveName)
            destination = staging.map { it.file(archiveName) }
            requirePlaintext = true
        }
    }

    def dockerContext = images.stagingRoot.dir("docker-context/security-tool/${ver}")
    tasks.register("prepareDockerContext_${ver}", Sync) {
        description = "Assemble the security-tool Docker build context for TW ${ver}"
        group = 'images'
        dependsOn "fetchJdk_${ver}", "decryptVendor_${ver}"
        dependsOn overrideTasks.values().flatten().findAll { it.endsWith("_${ver}") }
        from(context.map { it.dir('dockerfiles/security-tool/imageFiles') }) { into 'imageFiles' }
        from(staging) { into 'staging' }
        into dockerContext
    }

    tasks.register("buildSecurityTool_${ver}", DockerBuild) {
        description = "Build security-tool image for TW ${ver}"
        dependsOn "prepareDockerContext_${ver}"
        contextDir = dockerContext
        dockerfile = context.map { it.file('dockerfiles/security-tool/Dockerfile') }
        buildArgs = [
            BASE_IMAGE                : cfg.baseImage,
            JAVA_ARCHIVE              : jdk.archive,
            SECURITY_TOOL_ARCHIVE     : cfg.securityToolArchive,
            TEMPLATE_PROCESSOR_ARCHIVE: cfg.templateProcessorArchive,
        ]
        tags = ["${IMAGE}:${cfg.versionTag}".toString(), "${IMAGE}:latest".toString()]
    }
}

tasks.register('decryptVendor') {
    description = 'Stage vendor security-tool DockerFiles for all TW versions'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "decryptVendor_${it}" }
}

tasks.register('fetchJdk') {
    description = 'Fetch Corretto JDK for all TW versions into security-tool staging'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "fetchJdk_${it}" }
}

tasks.register('fetchTemplateProcessor') {
    description = 'Stage template-processor archive overrides from vendor/'
    group = 'images'
    dependsOn overrideTasks.templateProcessor
}

tasks.register('fetchSecurityTool') {
    description = 'Stage security-tool archive overrides from vendor/'
    group = 'images'
    dependsOn overrideTasks.securityTool
}

tasks.register('stageAll') {
    description = 'Stage all dependencies for security-tool builds'
    group = 'images'
    dependsOn 'fetchJdk', 'fetchTemplateProcessor', 'fetchSecurityTool'
}

tasks.register('buildAll') {
    description = 'Build security-tool images for all TW versions'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "buildSecurityTool_${it}" }
}

tasks.register('pushAll', DockerPush) {
    description = 'Push all security-tool images to ghcr.io'
    dependsOn 'buildAll'
    tags = ALL_TWX.values().collect { "${IMAGE}:${it.versionTag}".toString() } + ["${IMAGE}:latest".toString()]
}
