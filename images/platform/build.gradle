plugins {
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

def ALL_TWX = [
    '9.6': [
        platformDockerFiles: 'MED-61268-CD-096_9-6-9_ThingWorx-Platform-DockerFiles-9-6-9.gz',
        platformPostgres:   'MED-61111-CD-096_9-6-9_ThingWorx-Platform-Postgres-9-6-9.zip',
        tomcatVersion:      '9.0.120',
        platformVersion:    '9.6.9',
        baseImage:          'ubuntu:22.04',
    ],
    '9.7': [
        platformDockerFiles: 'MED-61268-CD-097_9-7-6_ThingWorx-Platform-DockerFiles-9-7-6.gz',
        platformPostgres:   'MED-61111-CD-097_9-7-6_ThingWorx-Platform-Postgres-9-7-6.zip',
        tomcatVersion:      '9.0.120',
        platformVersion:    '9.7.6',
        baseImage:          'ubuntu:22.04',
    ],
    '10.0': [
        platformDockerFiles: 'MED-61268-CD-100_10-0-4_ThingWorx-Platform-DockerFiles-10-0-4.gz',
        platformPostgres:   'MED-61111-CD-100_10-0-4_ThingWorx-Platform-Postgres-10-0-4.zip',
        tomcatVersion:      '11.0.0',
        platformVersion:    '10.0.4',
        baseImage:          'ubuntu:22.04',
    ],
    '10.1': [
        platformDockerFiles: 'MED-61268-CD-101_10-1-2_ThingWorx-Platform-DockerFiles-10-1-2.gz',
        platformPostgres:   'MED-61111-CD-101_10-1-2_ThingWorx-Platform-Postgres-10-1-2.zip',
        tomcatVersion:      '11.0.0',
        platformVersion:    '10.1.2',
        baseImage:          'ubuntu:24.04',
    ],
]

def ALL_VARIANTS = ['openjdk', 'corretto', 'graalvm']

def IMG_BUILD_DIR = "${projectDir}/../build"
def IMG_VENDOR_ARCHIVE = "${rootDir}/vendor/twx-resources.tar.gz.gpg"

tasks.register('decryptVendor') {
    description = 'Decrypt and extract vendor platform DockerFiles for all TW versions'
    group = 'images'
    def localBuildDir = IMG_BUILD_DIR
    def localArchive = IMG_VENDOR_ARCHIVE
    def localTwx = ALL_TWX
    doLast {
        def passphrase = System.getenv('GPG_PASSPHRASE') ?: ''
        localTwx.each { ver, cfg ->
            def dest = new File("${localBuildDir}/vendor-extracted/platform/${ver}")
            if (new File(dest, "build.sh").exists()) {
                println "Platform DockerFiles for ${ver} already extracted"
                return
            }
            dest.mkdirs()
            println "Extracting platform DockerFiles for TW ${ver}..."
            def cmd = "gpg --decrypt --batch --pinentry-mode loopback --passphrase '${passphrase}' '${localArchive}' 2>/dev/null | tar xzf - './${cfg.platformDockerFiles}' && gunzip -c '${cfg.platformDockerFiles}' | tar x && rm -f '${cfg.platformDockerFiles}'"
            def proc = new ProcessBuilder('bash', '-c', cmd).directory(dest).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("Failed to extract platform DockerFiles for TW ${ver} - check GPG_PASSPHRASE and vendor archive")
        }
    }
}

tasks.register('extractPlatformPostgres') {
    description = 'Extract platform-postgres WAR archives into staging directories'
    group = 'images'
    dependsOn 'decryptVendor'
    def localBuildDir = IMG_BUILD_DIR
    def localArchive = IMG_VENDOR_ARCHIVE
    def localTwx = ALL_TWX
    doLast {
        def passphrase = System.getenv('GPG_PASSPHRASE') ?: ''
        localTwx.each { ver, cfg ->
            def stage = new File("${localBuildDir}/vendor-extracted/platform/${ver}/staging")
            def warFile = new File(stage, cfg.platformPostgres)
            if (warFile.exists()) {
                println "Platform Postgres for ${ver} already staged"
                return
            }
            stage.mkdirs()
            println "Extracting platform-postgres WAR for TW ${ver}..."
            def cmd = "gpg --decrypt --batch --pinentry-mode loopback --passphrase '${passphrase}' '${localArchive}' 2>/dev/null | tar xzf - './${cfg.platformPostgres}'"
            def proc = new ProcessBuilder('bash', '-c', cmd).directory(stage).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("Failed to extract platform WAR for TW ${ver} - check GPG_PASSPHRASE and vendor archive")
        }
    }
}

def platformBuildTaskNames = []

ALL_VARIANTS.each { variant ->
    def localBuildDir = IMG_BUILD_DIR
    def localArchive = IMG_VENDOR_ARCHIVE
    def localVariant = variant

    tasks.register("fetchJdk_${localVariant}") {
        description = "Fetch JDK variant '${localVariant}' for all TW versions"
        group = 'images'
        dependsOn 'decryptVendor'
        doLast {
            def cacheDir = new File("${localBuildDir}/jdk-cache")
            cacheDir.mkdirs()
            // collect distinct archives for this variant and ensure cached once
            def archiveToUrl = [:]
            ALL_TWX.each { ver, cfg ->
                def archiveName
                if (localVariant == 'openjdk')  archiveName = 'OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz'
                else if (localVariant == 'corretto') archiveName = 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz'
                else if (localVariant == 'graalvm')  archiveName = 'graalvm-jdk-21.0.2_linux-x64_bin.tar.gz'
                if (!archiveToUrl.containsKey(archiveName)) {
                    def url
                    if (localVariant == 'corretto') {
                        url = 'https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz'
                    } else if (localVariant == 'openjdk') {
                        url = 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz'
                    } else if (localVariant == 'graalvm') {
                        url = 'https://download.oracle.com/graalvm/21/archive/graalvm-jdk-21.0.2_linux-x64_bin.tar.gz'
                    }
                    archiveToUrl[archiveName] = url
                }
            }
            // download each distinct archive once to cache
            archiveToUrl.each { archiveName, url ->
                def cached = new File(cacheDir, archiveName)
                if (!cached.exists()) {
                    println "Downloading JDK ${localVariant} ${archiveName}: ${url}"
                    def proc = new ProcessBuilder('curl', '-fsSL', '-o', cached.absolutePath, url).inheritIO().start()
                    if (proc.waitFor() != 0) throw new GradleException("curl failed for ${url}")
                } else {
                    println "JDK ${localVariant} ${archiveName} already cached"
                }
            }
            // copy from cache to each staging
            ALL_TWX.each { ver, cfg ->
                def archiveName
                if (localVariant == 'openjdk')  archiveName = 'OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz'
                else if (localVariant == 'corretto') archiveName = 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz'
                else if (localVariant == 'graalvm')  archiveName = 'graalvm-jdk-21.0.2_linux-x64_bin.tar.gz'
                def stage = new File("${localBuildDir}/vendor-extracted/platform/${ver}/staging")
                def jdkFile = new File(stage, archiveName)
                if (jdkFile.exists()) {
                    println "JDK ${localVariant} for ${ver} already present"
                    return
                }
                stage.mkdirs()
                def cached = new File(cacheDir, archiveName)
                println "Staging JDK ${localVariant} for ${ver} from cache"
                def cp = new ProcessBuilder('cp', cached.absolutePath, jdkFile.absolutePath).inheritIO().start()
                if (cp.waitFor() != 0) throw new GradleException("cp failed for ${archiveName}")
            }
        }
    }
}

ALL_VARIANTS.each { variant ->
    def localBuildDir = IMG_BUILD_DIR
    def localVariant = variant

    tasks.register("stageJdk_${localVariant}") {
        description = "Stage JDK variant '${localVariant}' into each TW version's staging directory"
        group = 'images'
        dependsOn "fetchJdk_${localVariant}", 'extractPlatformPostgres'
        doLast {
            println "JDK ${localVariant} staged for all TW versions"
        }
    }
}

ALL_VARIANTS.each { variant ->
    ALL_TWX.each { ver, cfg ->
        def capturedVer = ver
        def capturedCfg = cfg
        def capturedVariant = variant
        def localBuildDir = IMG_BUILD_DIR

        tasks.register("buildAll_${capturedVer}_${capturedVariant}") {
            description = "Build all platform images for TW ${capturedVer} with JDK ${capturedVariant}"
            group = 'images'
            dependsOn "stageJdk_${capturedVariant}"
            def completionMarker = new File("${localBuildDir}/platform-build-stamps/${capturedVer}-${capturedVariant}.complete")
            outputs.file completionMarker
            inputs.property('thingworxVersion', capturedVer)
            inputs.property('jdkVariant', capturedVariant)
            inputs.property('tomcatVersion', capturedCfg.tomcatVersion)
            inputs.property('platformVersion', capturedCfg.platformVersion)
            // Gradle fingerprints these files by content. The generated
            // build context and mutable build.env are deliberately excluded.
            inputs.files(fileTree(new File("${localBuildDir}/vendor-extracted/platform/${capturedVer}")) {
                exclude 'build/**', 'build.env'
            })
            doLast {
                def archiveName
                if (capturedVariant == 'openjdk')  archiveName = 'OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz'
                else if (capturedVariant == 'corretto') archiveName = 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz'
                else if (capturedVariant == 'graalvm')  archiveName = 'graalvm-jdk-21.0.2_linux-x64_bin.tar.gz'

                def stage = new File("${localBuildDir}/vendor-extracted/platform/${capturedVer}/staging")
                def jdkSrc = new File(stage, archiveName)
                if (!jdkSrc.exists()) throw new GradleException("JDK archive not found: ${jdkSrc}")

                def workDir = new File("${localBuildDir}/vendor-extracted/platform/${capturedVer}")
                def buildEnv = new File(workDir, "build.env")
                def patchVersion = capturedCfg.tomcatVersion.substring(capturedCfg.tomcatVersion.lastIndexOf('.') + 1)
                buildEnv.text = buildEnv.text
                    .replaceAll(/<supported_patch_version>/, patchVersion)
                    .replaceAll(/(?m)^JAVA_ARCHIVE=.*/, "JAVA_ARCHIVE=${archiveName}")
                    .replaceAll(/(?m)^BASE_IMAGE=.*/, "BASE_IMAGE=${capturedCfg.baseImage}")
                    .replaceAll(/(?m)^PLATFORM_POSTGRES_ARCHIVE=.*/, "PLATFORM_POSTGRES_ARCHIVE=${capturedCfg.platformPostgres}")

                println "Staging dependencies for TW ${capturedVer} JDK ${capturedVariant}..."
                def stagingDir = new File(workDir, "staging")
                def tomcatArchive = "apache-tomcat-${capturedCfg.tomcatVersion}.tar.gz"
                def tomcatFile = new File(stagingDir, tomcatArchive)
                if (!tomcatFile.exists()) {
                    def tomcatMajor = capturedCfg.tomcatVersion.substring(0, capturedCfg.tomcatVersion.indexOf('.'))
                    def tomcatUrl = "https://archive.apache.org/dist/tomcat/tomcat-${tomcatMajor}/v${capturedCfg.tomcatVersion}/bin/${tomcatArchive}"
                    def tomcatAsc = "${tomcatUrl}.asc"
                    println "Downloading Tomcat: ${tomcatUrl}"
                    def dlTomcat = new ProcessBuilder('curl', '-fsSL', '-o', tomcatFile.absolutePath, tomcatUrl).inheritIO().start()
                    if (dlTomcat.waitFor() != 0) throw new GradleException("Failed to download Tomcat")
                    def dlAsc = new ProcessBuilder('curl', '-fsSL', '-o', "${tomcatFile.absolutePath}.asc", tomcatAsc).inheritIO().start()
                    if (dlAsc.waitFor() != 0) throw new GradleException("Failed to download Tomcat ASC")
                }

                println "Building all platform images for TW ${capturedVer} with JDK ${capturedVariant}..."
                // ensure docker build uses host network for DNS (Docker Desktop DNS may be broken) and avoid duplicate flags
                new ProcessBuilder('bash', '-c', "sed -i 's/ --network=host//g; s/--pull=false//g; s/docker build/docker build --pull=false --network=host/g' build.sh").directory(workDir).inheritIO().start().waitFor()
                // add retries to apt-get in base Dockerfile (flaky archive.ubuntu.com)
                new ProcessBuilder('bash', '-c', "sed -i 's/RUN apt-get update && apt-get dist-upgrade/RUN for i in 1 2 3 4 5; do apt-get update \\&\\& break || sleep 5; done \\&\\& apt-get dist-upgrade/' dockerfiles/base/Dockerfile").directory(workDir).inheritIO().start().waitFor()
                def attempt = 0
                def success = false
                def lastExit = 0
                while (attempt < 3 && !success) {
                    attempt++
                    if (attempt > 1) println "Retrying build.sh postgres for TW ${capturedVer} JDK ${capturedVariant} attempt ${attempt}/3 ..."
                    def proc = new ProcessBuilder('bash', 'build.sh', 'postgres').directory(workDir)
                        .redirectErrorStream(true).start()
                    proc.inputStream.eachLine { line -> println "  [build] ${line}" }
                    lastExit = proc.waitFor()
                    if (lastExit == 0) success = true
                    else if (attempt < 3) Thread.sleep(5000)
                }
                if (!success) throw new GradleException("build.sh postgres failed for TW ${capturedVer} JDK ${capturedVariant} after 3 attempts")

                def tagVersion = "java${archiveName.replaceAll(/\.tar\.gz$/, '').replaceAll(/amazon-/, '').toLowerCase()}-tomcat${capturedCfg.tomcatVersion}"
                def pgTag = "${tagVersion}-platform${capturedCfg.platformVersion}"
                def pfx = 'ghcr.io/us-ignite/thingworx'

                new ProcessBuilder('bash', '-c', "docker tag thingworx/base:${tagVersion} ${pfx}/base:${capturedCfg.platformVersion}-${capturedVariant}").inheritIO().start().waitFor()
                new ProcessBuilder('bash', '-c', "docker tag thingworx/tw-platform-base:${tagVersion} ${pfx}/platform-base:${capturedCfg.platformVersion}-${capturedVariant}").inheritIO().start().waitFor()
                new ProcessBuilder('bash', '-c', "docker tag thingworx/platform-postgres:${pgTag} ${pfx}/platform-postgres:${capturedCfg.platformVersion}-${capturedVariant}").inheritIO().start().waitFor()
                new ProcessBuilder('bash', '-c', "docker tag thingworx/postgresql-init-twx:${pgTag} ${pfx}/postgres-init:${capturedCfg.platformVersion}-${capturedVariant}").inheritIO().start().waitFor()

                if (capturedVariant == 'corretto') {
                    new ProcessBuilder('bash', '-c', "docker tag thingworx/base:${tagVersion} ${pfx}/base:${capturedCfg.platformVersion}").inheritIO().start().waitFor()
                    new ProcessBuilder('bash', '-c', "docker tag thingworx/tw-platform-base:${tagVersion} ${pfx}/platform-base:${capturedCfg.platformVersion}").inheritIO().start().waitFor()
                    new ProcessBuilder('bash', '-c', "docker tag thingworx/platform-postgres:${pgTag} ${pfx}/platform-postgres:${capturedCfg.platformVersion}").inheritIO().start().waitFor()
                    new ProcessBuilder('bash', '-c', "docker tag thingworx/postgresql-init-twx:${pgTag} ${pfx}/postgres-init:${capturedCfg.platformVersion}").inheritIO().start().waitFor()
                }

                completionMarker.parentFile.mkdirs()
                completionMarker.text = "Successful build for ${capturedVer} / ${capturedVariant}\n"
                println "Done building platform images for TW ${capturedVer} JDK ${capturedVariant}"
            }
        }
        platformBuildTaskNames << "buildAll_${capturedVer}_${capturedVariant}"
    }
}

// build.sh uses a shared `build/` directory inside each ThingWorx version.
// Do not allow the three JDK variants for a version to copy/clean that
// directory concurrently.
platformBuildTaskNames.eachWithIndex { taskName, index ->
    if (index > 0) {
        tasks.named(taskName).configure {
            mustRunAfter platformBuildTaskNames[index - 1]
        }
    }
}

tasks.register('buildAll') {
    description = 'Build all platform images for all TW versions and JDK variants'
    group = 'images'
    dependsOn ALL_TWX.keySet().collectMany { ver ->
        ALL_VARIANTS.collect { variant -> "buildAll_${ver}_${variant}" }
    }
}

ALL_VARIANTS.each { variant ->
    tasks.register("buildAll_${variant}") {
        description = "Build all platform images for JDK variant '${variant}'"
        group = 'images'
        dependsOn ALL_TWX.keySet().collect { ver -> "buildAll_${ver}_${variant}" }
    }
}

ALL_TWX.each { ver, cfg ->
    tasks.register("buildAll_${ver}") {
        description = "Build all platform images for TW ${ver}"
        group = 'images'
        dependsOn ALL_VARIANTS.collect { variant -> "buildAll_${ver}_${variant}" }
    }
}

// Legacy aliases for :apps:thingworx-jgit-extension:test which expects build101 etc.
ALL_TWX.each { ver, cfg ->
    def legacy = ver.replace('.', '')
    def capturedLegacy = legacy
    def capturedVer = ver
    tasks.register("build${capturedLegacy}") {
        description = "Legacy alias for buildAll_${capturedVer}_openjdk"
        group = 'images'
        dependsOn "buildAll_${capturedVer}_openjdk"
    }
}

tasks.register('pushAll') {
    description = 'Push all platform images to ghcr.io'
    group = 'publishing'
    dependsOn 'buildAll'
    doLast {
        def allVersions = [
            [ver: '9.6',  platformVersion: '9.6.9'],
            [ver: '9.7',  platformVersion: '9.7.6'],
            [ver: '10.0', platformVersion: '10.0.4'],
            [ver: '10.1', platformVersion: '10.1.2'],
        ]
        def allVariants = ['openjdk', 'corretto', 'graalvm']
        def pfx = 'ghcr.io/us-ignite/thingworx'
        allVersions.each { vcfg ->
            allVariants.each { v ->
                ['base', 'platform-base', 'platform-postgres', 'postgres-init'].each { img ->
                    def p = new ProcessBuilder('docker', 'push', "${pfx}/${img}:${vcfg.platformVersion}-${v}").inheritIO().start()
                    if (p.waitFor() != 0) throw new GradleException("docker push failed: ${img}:${vcfg.platformVersion}-${v}")
                }
            }
            ['base', 'platform-base', 'platform-postgres', 'postgres-init'].each { img ->
                def p = new ProcessBuilder('docker', 'push', "${pfx}/${img}:${vcfg.platformVersion}").inheritIO().start()
                if (p.waitFor() != 0) throw new GradleException("docker push failed: ${img}:${vcfg.platformVersion}")
            }
        }
    }
}

tasks.register('cleanImages', Delete) {
    description = 'Delete all extracted vendor files and build contexts'
    group = 'cleanup'
    delete file("${projectDir}/../build")
}

tasks.register('cleanVendor') {
    description = 'Clean build outputs (alias for cleanImages)'
    group = 'cleanup'
    dependsOn 'cleanImages'
}
