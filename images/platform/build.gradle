import thingworx.docker.DockerPush
import thingworx.docker.ExtractVendorArchive
import thingworx.docker.PlatformImageBuild
import thingworx.tasks.StageFile
import thingworx.tasks.VerifiedDownload

plugins {
    id 'thingworx.docker'
}

def ALL_TWX = [
    '9.6': [
        platformDockerFiles: 'MED-61268-CD-096_9-6-9_ThingWorx-Platform-DockerFiles-9-6-9.gz',
        platformPostgres:   'MED-61111-CD-096_9-6-9_ThingWorx-Platform-Postgres-9-6-9.zip',
        tomcatVersion:      '9.0.120',
        platformVersion:    '9.6.9',
        baseImage:          'ubuntu:22.04',
    ],
    '9.7': [
        platformDockerFiles: 'MED-61268-CD-097_9-7-6_ThingWorx-Platform-DockerFiles-9-7-6.gz',
        platformPostgres:   'MED-61111-CD-097_9-7-6_ThingWorx-Platform-Postgres-9-7-6.zip',
        tomcatVersion:      '9.0.120',
        platformVersion:    '9.7.6',
        baseImage:          'ubuntu:22.04',
    ],
    '10.0': [
        platformDockerFiles: 'MED-61268-CD-100_10-0-4_ThingWorx-Platform-DockerFiles-10-0-4.gz',
        platformPostgres:   'MED-61111-CD-100_10-0-4_ThingWorx-Platform-Postgres-10-0-4.zip',
        tomcatVersion:      '11.0.0',
        platformVersion:    '10.0.4',
        baseImage:          'ubuntu:22.04',
    ],
    '10.1': [
        platformDockerFiles: 'MED-61268-CD-101_10-1-2_ThingWorx-Platform-DockerFiles-10-1-2.gz',
        platformPostgres:   'MED-61111-CD-101_10-1-2_ThingWorx-Platform-Postgres-10-1-2.zip',
        tomcatVersion:      '11.0.0',
        platformVersion:    '10.1.2',
        baseImage:          'ubuntu:24.04',
    ],
    '10.2': [
        platformDockerFiles: 'MED-61268-CD-102_10-2-1_ThingWorx-Platform-DockerFiles-10-2-1.gz',
        platformPostgres:   'MED-61111-CD-102_10-2-1_ThingWorx-Platform-Postgres-10-2-1.zip',
        tomcatVersion:      '11.0.0',
        platformVersion:    '10.2.1',
        baseImage:          'ubuntu:24.04',
    ],
]

// JDK variants. Corretto is the default: it also receives the unsuffixed tags.
def JDKS = [
    openjdk : [archive: 'OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz',
               url: 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz'],
    corretto: [archive: 'amazon-corretto-21.0.2.13.1-linux-x64.tar.gz',
               url: 'https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz'],
    graalvm : [archive: 'graalvm-jdk-21.0.2_linux-x64_bin.tar.gz',
               url: 'https://download.oracle.com/graalvm/21/archive/graalvm-jdk-21.0.2_linux-x64_bin.tar.gz'],
]
def DEFAULT_VARIANT = 'corretto'

def images = thingworxImages
def jdkCache = images.stagingRoot.dir('jdk-cache')

JDKS.each { variant, jdk ->
    tasks.register("fetchJdk_${variant}", VerifiedDownload) {
        description = "Fetch JDK variant '${variant}'"
        group = 'images'
        url = jdk.url
        outputFile = jdkCache.map { it.file(jdk.archive) }
    }
}

ALL_TWX.collect { it.value.tomcatVersion }.unique().each { tomcat ->
    def major = tomcat.substring(0, tomcat.indexOf('.'))
    def archive = "apache-tomcat-${tomcat}.tar.gz"
    def url = "https://archive.apache.org/dist/tomcat/tomcat-${major}/v${tomcat}/bin/${archive}"
    tasks.register("fetchTomcat_${tomcat}", VerifiedDownload) {
        description = "Fetch Apache Tomcat ${tomcat}"
        group = 'images'
        it.url = url
        outputFile = jdkCache.map { it.file(archive) }
    }
    tasks.register("fetchTomcatSignature_${tomcat}", VerifiedDownload) {
        description = "Fetch the Apache Tomcat ${tomcat} signature"
        group = 'images'
        it.url = "${url}.asc"
        outputFile = jdkCache.map { it.file("${archive}.asc") }
    }
}

def platformBuildTaskNames = []

ALL_TWX.each { ver, cfg ->
    def context = images.context('platform', ver)
    def staging = context.map { it.dir('staging') }
    def stage = { String name, Object sourceFile, String fileName, boolean plaintext ->
        tasks.register(name, StageFile) {
            dependsOn "decryptVendor_${ver}"
            source = sourceFile
            destination = staging.map { it.file(fileName) }
            requirePlaintext = plaintext
        }
    }

    tasks.register("decryptVendor_${ver}", ExtractVendorArchive) {
        description = "Stage vendor platform DockerFiles for TW ${ver}"
        archive = images.vendorFile(cfg.platformDockerFiles)
        destination = context
    }
    stage("stagePlatformPostgres_${ver}", images.vendorFile(cfg.platformPostgres), cfg.platformPostgres, true)
    def tomcatArchive = "apache-tomcat-${cfg.tomcatVersion}.tar.gz"
    stage("stageTomcat_${ver}", tasks.named("fetchTomcat_${cfg.tomcatVersion}").flatMap { it.outputFile }, tomcatArchive, false)
    stage("stageTomcatSignature_${ver}", tasks.named("fetchTomcatSignature_${cfg.tomcatVersion}").flatMap { it.outputFile }, "${tomcatArchive}.asc", false)

    JDKS.each { variant, jdk ->
        stage("stageJdk_${ver}_${variant}", tasks.named("fetchJdk_${variant}").flatMap { it.outputFile }, jdk.archive, false)

        def taskName = "buildAll_${ver}_${variant}"
        tasks.register(taskName, PlatformImageBuild) {
            description = "Build all platform images for TW ${ver} with JDK ${variant}"
            dependsOn "stageJdk_${ver}_${variant}", "stagePlatformPostgres_${ver}", "stageTomcat_${ver}", "stageTomcatSignature_${ver}"
            displayName = "platform images for TW ${ver} JDK ${variant}"
            workDir = context
            arguments = ['postgres']
            javaArchive = jdk.archive
            tomcatVersion = cfg.tomcatVersion
            platformVersion = cfg.platformVersion
            it.variant = variant
            defaultVariant = variant == DEFAULT_VARIANT
            envPlaceholders = ['<supported_patch_version>': cfg.tomcatVersion.substring(cfg.tomcatVersion.lastIndexOf('.') + 1)]
            envOverrides = [
                JAVA_ARCHIVE             : jdk.archive,
                BASE_IMAGE               : cfg.baseImage,
                PLATFORM_POSTGRES_ARCHIVE: cfg.platformPostgres,
            ]
            // Retry apt-get in the base Dockerfile (flaky archive.ubuntu.com).
            filePatches = ['dockerfiles/base/Dockerfile': [
                'RUN apt-get update && apt-get dist-upgrade':
                    'RUN for i in 1 2 3 4 5; do apt-get update && break || sleep 5; done && apt-get dist-upgrade',
            ]]
            requiredFiles = ["staging/${jdk.archive}".toString()]
            expectedImages = PlatformImageBuild.targetTags(cfg.platformVersion, variant, variant == DEFAULT_VARIANT)
            // Fingerprinted by content; the generated build/ context and mutable build.env are excluded.
            contextFiles.from(context.map { dir -> fileTree(dir) { exclude 'build/**', 'build.env' } })
            stamp = images.stagingRoot.file("platform-build-stamps/${ver}-${variant}.complete")
        }
        platformBuildTaskNames << taskName
    }
}

// build.sh uses a shared `build/` directory inside each ThingWorx version, so platform
// builds must not run concurrently.
platformBuildTaskNames.eachWithIndex { taskName, index ->
    if (index > 0) tasks.named(taskName) { mustRunAfter platformBuildTaskNames[index - 1] }
}

tasks.register('decryptVendor') {
    description = 'Stage vendor platform DockerFiles for all TW versions'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "decryptVendor_${it}" }
}

tasks.register('extractPlatformPostgres') {
    description = 'Stage platform-postgres WAR archives into staging directories'
    group = 'images'
    dependsOn ALL_TWX.keySet().collect { "stagePlatformPostgres_${it}" }
}

JDKS.keySet().each { variant ->
    tasks.register("stageJdk_${variant}") {
        description = "Stage JDK variant '${variant}' into each TW version's staging directory"
        group = 'images'
        dependsOn ALL_TWX.keySet().collect { "stageJdk_${it}_${variant}" }, 'extractPlatformPostgres'
    }
    tasks.register("buildAll_${variant}") {
        description = "Build all platform images for JDK variant '${variant}'"
        group = 'images'
        dependsOn ALL_TWX.keySet().collect { "buildAll_${it}_${variant}" }
    }
}

ALL_TWX.keySet().each { ver ->
    tasks.register("buildAll_${ver}") {
        description = "Build all platform images for TW ${ver}"
        group = 'images'
        dependsOn JDKS.keySet().collect { "buildAll_${ver}_${it}" }
    }
    // Legacy alias used by the container tests (e.g. build102).
    tasks.register("build${ver.replace('.', '')}") {
        description = "Legacy alias for buildAll_${ver}_openjdk"
        group = 'images'
        dependsOn "buildAll_${ver}_openjdk"
    }
}

tasks.register('buildAll') {
    description = 'Build all platform images for all TW versions and JDK variants'
    group = 'images'
    dependsOn platformBuildTaskNames
}

tasks.register('pushAll', DockerPush) {
    description = 'Push all platform images to ghcr.io'
    dependsOn 'buildAll'
    tags = ALL_TWX.values().collectMany { cfg ->
        JDKS.keySet().collectMany { variant -> PlatformImageBuild.targetTags(cfg.platformVersion, variant, variant == DEFAULT_VARIANT) }
    }.unique()
}
