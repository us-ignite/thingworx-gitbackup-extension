import thingworx.docker.DockerBuild
import thingworx.docker.DockerPush

plugins {
    id 'thingworx.docker'
}

def operatorVersion = providers.fileContents(rootProject.layout.projectDirectory.file('apps/thingworx-operator/.version')).asText.map { it.trim() }
def registryTags = operatorVersion.map { v -> ["ghcr.io/us-ignite/thingworx/thingworx-operator:${v}".toString(), 'ghcr.io/us-ignite/thingworx/thingworx-operator:latest'] }

tasks.register('decryptVendor') {
    description = 'Placeholder - operator has no vendor archives'
    group = 'images'
}

tasks.register('buildImage', DockerBuild) {
    description = 'Build thingworx-operator Docker image'
    dependsOn ':apps:thingworx-operator:fatJar'
    contextDir = rootProject.layout.projectDirectory
    dockerfile = layout.projectDirectory.file('Dockerfile')
    extraArguments = ['--progress=plain', '--network=host']
    buildArgs = operatorVersion.map { v -> [OPERATOR_VERSION: v] }
    tags = operatorVersion.map { v -> ["thingworx-operator:${v}".toString(), 'thingworx-operator:dev'] }.zip(registryTags) { local, remote -> local + remote }
}

tasks.register('buildAll') {
    description = 'Build all thingworx-operator image artifacts (alias for buildImage)'
    group = 'build'
    dependsOn 'buildImage'
}

tasks.register('pushImage', DockerPush) {
    description = 'Push thingworx-operator image to ghcr.io'
    dependsOn 'buildImage'
    tags = registryTags
}
