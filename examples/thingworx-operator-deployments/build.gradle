// Deploys the ThingWorx operator chart and an example ThingWorxCluster:
//   checkDeploymentTools -> installOperatorChart -> deployOperatorChart (waits for rollout)
//   deploy<Scenario>Cluster: require<Scenario>Resources + render<Scenario>Cluster
//                            -> apply<Scenario>Cluster -> wait for READY
// Override defaults with -PkubeContext, -PoperatorNamespace, -PthingworxNamespace,
// -PhelmRelease, -PdeploymentTimeout, -PoperatorImageRepository, -PoperatorImageTag
// and the per-image properties listed in IMAGE_PROPERTIES.
import thingworx.helm.RequireKubernetesResources

plugins {
    id 'base'
    id 'thingworx.base'
    id 'thingworx.lifecycle-aliases'
}

def setting = { String name, String fallback ->
    providers.gradleProperty(name).map { it.trim() }.filter { !it.isEmpty() }.getOrElse(fallback)
}

def chartDir = rootProject.layout.projectDirectory.dir('charts/thingworx-operator')
def kubeContext = setting('kubeContext', '')
def operatorNamespace = setting('operatorNamespace', 'thingworx-operator')
def thingworxNamespace = setting('thingworxNamespace', 'thingworx')
def helmRelease = setting('helmRelease', 'thingworx-operator')
def waitTimeout = setting('deploymentTimeout', '30m')
def operatorImageRepository = setting('operatorImageRepository', 'ghcr.io/us-ignite/thingworx/thingworx-operator')
def operatorImageTag = setting('operatorImageTag', 'latest')

def kubectl = { List<String> args -> ['kubectl'] + (kubeContext ? ['--context', kubeContext] : []) + args }

tasks.register('checkHelm', Exec) {
    group = 'deployment'
    description = 'Require helm for operator deployment tasks'
    commandLine 'helm', 'version', '--short'
}

tasks.register('checkKubectl', Exec) {
    group = 'deployment'
    description = 'Require kubectl for operator deployment tasks'
    commandLine kubectl(['version', '--client=true'])
}

tasks.register('checkDeploymentTools') {
    group = 'deployment'
    description = 'Require helm and kubectl'
    dependsOn 'checkHelm', 'checkKubectl'
}

tasks.register('installOperatorChart', Exec) {
    group = 'deployment'
    description = 'Install or upgrade the ThingWorx operator Helm chart'
    dependsOn 'checkDeploymentTools'
    inputs.dir(chartDir).withPathSensitivity(PathSensitivity.RELATIVE)
    commandLine(['helm'] + (kubeContext ? ['--kube-context', kubeContext] : []) + [
            'upgrade', '--install', helmRelease, chartDir.asFile.absolutePath,
            '--namespace', operatorNamespace, '--create-namespace',
            '--set', "image.repository=${operatorImageRepository}".toString(),
            '--set', "image.tag=${operatorImageTag}".toString(),
            '--set', "watchedNamespaces=${thingworxNamespace}".toString()])
}

tasks.register('deployOperatorChart', Exec) {
    group = 'deployment'
    description = 'Install or upgrade the ThingWorx operator Helm chart and wait for rollout.'
    dependsOn 'installOperatorChart'
    commandLine kubectl(['rollout', 'status', "deployment/${helmRelease}-thingworx-operator".toString(),
                         '-n', operatorNamespace, '--timeout', waitTimeout])
}

// Image properties override only the corresponding image field, leaving the checked-in
// examples usable as documentation when no override is supplied.
def IMAGE_PROPERTIES = [
        platform          : 'platformImage',
        databaseInit      : 'databaseInitImage',
        securityCli       : 'securityCliImage',
        ignite            : 'igniteImage',
        cxServer          : 'cxServerImage',
        haProxy           : 'haProxyImage',
        zookeeper         : 'zookeeperImage',
        extensionInstaller: 'extensionInstallerImage',
        image             : 'postgresImage',
]
def imageOverrides = IMAGE_PROPERTIES.collectEntries { field, property -> [(field): setting(property, '')] }.findAll { it.value }

def SCENARIOS = [
        Production : [manifest: 'thingworxcluster.yaml', cluster: 'production',
                      description: 'Deploy the HA production ThingWorxCluster configuration and wait for READY.',
                      extraResources: ['secret/thingworx-registry', 'configmap/thingworx-settings']],
        Development: [manifest: 'thingworxcluster-single-node.yaml', cluster: 'development',
                      description: 'Deploy the single-node development ThingWorxCluster configuration and wait for READY.',
                      extraResources: []],
]
def COMMON_SECRETS = ['thingworx-license', 'thingworx-platform-admin', 'thingworx-keystore',
                      'thingworx-app-keys', 'thingworx-database', 'thingworx-database-admin']

SCENARIOS.each { scenario, spec ->
    def render = tasks.register("render${scenario}Cluster", Copy) {
        group = 'deployment'
        description = "Render the ${spec.cluster} ThingWorxCluster manifest for namespace ${thingworxNamespace}"
        inputs.property('namespace', thingworxNamespace)
        inputs.property('images', imageOverrides)
        from layout.projectDirectory.file(spec.manifest)
        into layout.buildDirectory.dir('generated/deployments')
        filter { String line ->
            if (line ==~ /^  namespace: .*$/) return "  namespace: ${thingworxNamespace}".toString()
            imageOverrides.inject(line) { current, field, value ->
                current.replaceAll(/^(\s+${field}:\s+).*$/, "\$1${java.util.regex.Matcher.quoteReplacement(value)}")
            }
        }
    }

    tasks.register("require${scenario}Resources", RequireKubernetesResources) {
        description = "Require the namespace, Secrets and ConfigMaps the ${spec.cluster} cluster uses"
        mustRunAfter 'deployOperatorChart'
        namespace = thingworxNamespace
        it.kubeContext = kubeContext
        resources = ["namespace/${thingworxNamespace}".toString()] +
                COMMON_SECRETS.collect { "secret/${it}".toString() } + spec.extraResources
    }

    tasks.register("apply${scenario}Cluster", Exec) {
        group = 'deployment'
        description = "Apply the ${spec.cluster} ThingWorxCluster configuration"
        dependsOn 'deployOperatorChart', "require${scenario}Resources"
        inputs.files(render)
        commandLine kubectl(['apply', '--namespace', thingworxNamespace, '--filename',
                             layout.buildDirectory.file("generated/deployments/${spec.manifest}").get().asFile.absolutePath])
    }

    tasks.register("deploy${scenario}Cluster", Exec) {
        group = 'deployment'
        description = spec.description
        dependsOn "apply${scenario}Cluster"
        commandLine kubectl(['wait', "thingworxcluster/${spec.cluster}".toString(),
                             '--for=jsonpath={.status.phase}=READY',
                             '--namespace', thingworxNamespace, '--timeout', waitTimeout])
    }
}
