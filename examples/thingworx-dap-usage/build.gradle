plugins {
    id 'thingworx.java'
    id 'thingworx.eclipse'
    id 'thingworx.spotless'
    id 'thingworx.sdk'
    id 'thingworx.dap'
}

dependencies {
    implementation project(':libraries:thingworx-dap-runtime')
    implementation project(':libraries:thingworx-dap')
    compileOnly thingworxSdk.jars
}

thingworxDap {
    outputDir = layout.buildDirectory.dir('generated/dap-example')
    packageVersion = '1.0.0'
    minimumThingWorxVersion = '9.6.0'
}

tasks.register('verifyDapExample') {
    description = 'Compile the DAP example and verify its generated ThingWorx XML'
    group = 'verification'
    def generated = files(thingworxDap.outputDir) { builtBy 'compileJava' }
    inputs.files(generated).withPathSensitivity(PathSensitivity.RELATIVE)
    doLast {
        def dir = generated.singleFile
        def shape = new XmlSlurper().parse(new File(dir, 'DataShapes/GIT.ExampleCommit.DataShape.xml')).DataShapes.DataShape
        assert shape.@name.text() == 'GIT.ExampleCommit.DataShape'
        assert shape.FieldDefinitions.FieldDefinition*.@name*.text() == ['CommitID', 'Message']
        def wrapper = new XmlSlurper().parse(new File(dir, 'DataShapes/GIT.ExampleCommit.ServiceResult.DataShape.xml')).DataShapes.DataShape
        assert wrapper.FieldDefinitions.FieldDefinition.find { it.@name.text() == 'Result' }.@'aspect.dataShape'.text() == 'GIT.ExampleCommit.DataShape'
    }
}
