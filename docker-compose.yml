services:
  postgres:
    image: postgres:15
    container_name: twx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: twx_password_123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - twx-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-init:
    image: devopscadit/postgresql-init-twx:platform9.7.5
    container_name: twx-db-init
    entrypoint: ["/bin/bash", "/scripts/db-init-wrapper.sh"]
    environment:
      DATABASE_ADMIN_USERNAME: postgres
      DATABASE_ADMIN_PASSWORD: twx_password_123
      DATABASE_ADMIN_SCHEMA: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twadmin_9_7_5
      TWX_DATABASE_SCHEMA: twadmin_9_7_5
      TWX_DATABASE_PASSWORD: twx_password_123
      TABLESPACE_LOCATION: /var/lib/postgresql/data
    networks:
      - twx-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/db-init-wrapper.sh:/scripts/db-init-wrapper.sh:ro

  thingworx:
    image: devopscadit/platform-postgres:platform9.7.5
    container_name: twx-platform
    ports:
      - "8080:8080"
    entrypoint: ["sh", "-c", "rm -rf /opt/jdk && ln -sf /mnt/jdk21 /opt/jdk && exec /docker-entrypoint.sh run"]
    volumes:
      - ./.cache/jdk21:/mnt/jdk21:ro
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twadmin_9_7_5
      TWX_DATABASE_SCHEMA: twadmin_9_7_5
      TWX_DATABASE_PASSWORD: twx_password_123
      THINGWORX_INITIAL_ADMIN_PASSWORD: TwxAdm1nP@ssw0rd!
      THINGWORX_INITIAL_METRICS_USER_PASSWORD: MetricsP@ssw0rd!
      ENABLE_CONSOLE_OUTPUT: "true"
      CATALINA_OPTS: -Xms1g -Xmx2g --add-opens=java.base/java.net=ALL-UNNAMED
      THINGWORX_PLATFORM_SCRIPTTIMEOUT: "30"
      TOMCAT_KEEPALIVETIMEOUT: "20000"
      TOMCAT_CONNECTIONTIMEOUT: "20000"
      TOMCAT_MAXCONNECTION: "10000"
      TOMCAT_MAXTHREADS: "200"
      TOMCAT_CATALINA_LEVEL: FINE
      TOMCAT_LOCALHOST_LEVEL: FINE
      TOMCAT_MANAGER_LEVEL: FINE
      TOMCAT_HOSTMANAGER_LEVEL: FINE
      EXTPKG_IMPORT_POLICY_ENABLED: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_ENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_EXTENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JARRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_CSSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSONRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_WEBAPPRES: "true"
    env_file:
      - .env
    networks:
      - twx-network
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  gitea:
    image: gitea/gitea:1.22.3
    container_name: twx-gitea
    ports:
      - "3000:3000"
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      GITEA__database__DB_TYPE: sqlite3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - twx-network
    volumes:
      - gitea-data:/data

  gitea-init:
    image: gitea/gitea:1.22.3
    container_name: twx-gitea-init
    user: "1000:1000"
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      - twx-network
    volumes:
      - gitea-data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "[gitea-init] Waiting for Gitea API..."
        for i in $$(seq 1 30); do
          if curl -sf http://gitea:3000/api/v1/version > /dev/null 2>&1; then
            echo "[gitea-init] Gitea API ready."
            break
          fi
          echo "[gitea-init]  Waiting... ($$i/30)"
          sleep 3
        done

        echo "[gitea-init] Creating admin user 'testadmin'..."
        gitea admin user create --username testadmin --password testadmin123 --email admin@example.com --admin 2>&1 || echo "[gitea-init] User may already exist, continuing."

        echo "[gitea-init] Creating test repo 'gitbackup-test'..."
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          "http://gitea:3000/api/v1/user/repos" \
          -H "Content-Type: application/json" \
          -H "Authorization: Basic $$(printf '%s' 'testadmin:testadmin123' | base64)" \
          -d '{"name":"gitbackup-test","auto_init":false,"private":false}')
        echo "[gitea-init] Repo creation HTTP status: $$HTTP_CODE"

        echo "[gitea-init] Setup complete."

networks:
  twx-network:
    driver: bridge

volumes:
  pgdata:
  gitea-data:
