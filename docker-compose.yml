services:
  postgres:
    image: postgres:16
    container_name: twx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpass_P@ssw0rd!
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      twx-network:
        aliases:
          - postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-init:
    image: ghcr.io/us-ignite/thingworx/postgres-init:10.1.2
    container_name: twx-db-init
    entrypoint: ["/bin/bash", "/scripts/db-init-wrapper.sh"]
    environment:
      DATABASE_ADMIN_USERNAME: postgres
      DATABASE_ADMIN_PASSWORD: adminpass_P@ssw0rd!
      DATABASE_ADMIN_SCHEMA: postgres
      DATABASE_HOST: postgresql
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twxuser
      TWX_DATABASE_SCHEMA: twx
      TWX_DATABASE_PASSWORD: twxpass_P@ssw0rd!
      TABLESPACE_LOCATION: /var/lib/postgresql/data
    networks:
      - twx-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/thingworx-jgit-extension/scripts/db-init-wrapper.sh:/scripts/db-init-wrapper.sh:ro

  security-init:
    image: ghcr.io/us-ignite/thingworx/security-tool:10.1.2
    container_name: twx-security-init
    environment:
      KEYSTORE: "true"
      KEYSTORE_PASSWORD: thingworx-keystore-password
      KEYSTORE_PASSWORD_FILE_PATH: /ThingworxStorage
      KEYSTORE_FILE_PATH: /ThingworxStorage
      CUSTOM_SECRET_LIST: "encrypt.db.password:TWX_DATABASE_PASSWORD"
      TWX_DATABASE_PASSWORD: twxpass_P@ssw0rd!
      SECRET_PROVISIONING_APP_KEY: test-provisioning-key-12345
      ENCRYPT_CREDENTIALS: "true"
    networks:
      - twx-network
    volumes:
      - twx-storage:/ThingworxStorage

  thingworx:
    image: ghcr.io/us-ignite/thingworx/platform-postgres:10.1.2-openjdk
    container_name: twx-platform
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgresql
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twxuser
      TWX_DATABASE_SCHEMA: twx
      TWX_DATABASE_PASSWORD: twxpass_P@ssw0rd!
      KEYSTORE: "true"
      KEYSTORE_PASSWORD: thingworx-keystore-password
      KEYSTORE_PASSWORD_FILE_PATH: /ThingworxStorage
      KEYSTORE_FILE_PATH: /ThingworxStorage
      ENCRYPT_CREDENTIALS: "true"
      THINGWORX_INITIAL_ADMIN_PASSWORD: AdminP@ssw0rd!123
      THINGWORX_INITIAL_METRICS_USER_PASSWORD: MetricsP@ssw0rd!
      ENABLE_CONSOLE_OUTPUT: "true"
      CATALINA_OPTS: -Xms1g -Xmx2g --add-opens=java.base/java.net=ALL-UNNAMED
      THINGWORX_PLATFORM_SCRIPTTIMEOUT: "30"
      TOMCAT_KEEPALIVETIMEOUT: "20000"
      TOMCAT_CONNECTIONTIMEOUT: "20000"
      TOMCAT_MAXCONNECTION: "10000"
      TOMCAT_MAXTHREADS: "200"
      TOMCAT_CATALINA_LEVEL: FINE
      TOMCAT_LOCALHOST_LEVEL: FINE
      TOMCAT_MANAGER_LEVEL: FINE
      TOMCAT_HOSTMANAGER_LEVEL: FINE
      EXTPKG_IMPORT_POLICY_ENABLED: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_ENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_EXTENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JARRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_CSSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSONRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_WEBAPPRES: "true"
      LS_USERNAME: ${LS_USERNAME:-}
      LS_PASSWORD: ${LS_PASSWORD:-}
      USE_TRIAL_LICENSE: "true"
    volumes:
      - twx-storage:/ThingworxStorage
      - ./vendor/license.bin:/opt/trial.bin:ro
    networks:
      twx-network:
        aliases:
          - thingworx
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  gitea:
    image: gitea/gitea:1.20.4
    container_name: twx-gitea
    ports:
      - "3000:3000"
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      GITEA__database__DB_TYPE: sqlite3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - twx-network
    volumes:
      - gitea-data:/data

  gitea-init:
    image: gitea/gitea:1.20.4
    container_name: twx-gitea-init
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/scripts/gitea-init.sh"]
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_USERNAME: giteauser
      GITEA_PASSWORD: giteapass123
      GITEA_ADMIN_EMAIL: test@example.com
      GITEA_REPO_NAME: jgit-test-repo
      GITEA_REPO_AUTO_INIT: "true"
      GITEA_DEFAULT_BRANCH: main
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      - twx-network
    volumes:
      - ./apps/thingworx-jgit-extension/scripts/gitea-init.sh:/scripts/gitea-init.sh:ro
      - gitea-data:/data

  gitea-seed:
    image: gitea/gitea:1.20.4
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/scripts/gitea-seed.sh"]
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_USERNAME: giteauser
      GITEA_PASSWORD: giteapass123
      GITEA_REPO_NAME: jgit-test-repo
      GITEA_DEFAULT_BRANCH: main
      GITEA_SEED_PATH: examples/thingworx-jgit-extension-export
      GITEA_COMMIT_NAME: Gitea Test User
      GITEA_COMMIT_EMAIL: test@example.com
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    networks:
      - twx-network
    volumes:
      - ./examples/thingworx-jgit-extension-export:/seed:ro
      - ./apps/thingworx-jgit-extension/scripts/gitea-seed.sh:/scripts/gitea-seed.sh:ro
      - ./apps/thingworx-jgit-extension/scripts/gitea-askpass.sh:/scripts/gitea-askpass.sh:ro

  demo-init:
    image: curlimages/curl:7.85.0
    entrypoint: ["/bin/sh", "/scripts/configure-demo-repo.sh"]
    environment:
      TWX_URL: http://thingworx:8080
      TWX_USERNAME: Administrator
      TWX_PASSWORD: AdminP@ssw0rd!123
      GITEA_URL: http://gitea:3000
      GITEA_USERNAME: giteauser
      GITEA_PASSWORD: giteapass123
      GITEA_REPO_NAME: jgit-test-repo
      DEMO_REPO_NAME: demo
      DEMO_REPO_PATH: examples/thingworx-jgit-extension-export
      DEMO_PROJECT_NAME: Example
    depends_on:
      thingworx:
        condition: service_started
      gitea-seed:
        condition: service_completed_successfully
    networks:
      - twx-network
    volumes:
      - ./apps/thingworx-jgit-extension/scripts/configure-demo-repo.sh:/scripts/configure-demo-repo.sh:ro
      - ./examples/thingworx-jgit-extension-export:/example:ro

  extension-init:
    image: curlimages/curl:7.85.0
    profiles:
      - extension-install
    entrypoint: ["/bin/sh", "/scripts/install-extension.sh"]
    environment:
      TWX_URL: http://thingworx:8080
      TWX_USERNAME: Administrator
      TWX_PASSWORD: AdminP@ssw0rd!123
      EXTENSION_ZIP: /distributions/JGitExtension-v6.6.25-10.1.x.zip
    depends_on:
      thingworx:
        condition: service_started
    networks:
      - twx-network
    volumes:
      - ./apps/thingworx-jgit-extension/scripts/install-extension.sh:/scripts/install-extension.sh:ro
      - ./apps/thingworx-jgit-extension/versions/10.1/build/distributions:/distributions:ro

networks:
  twx-network:
    driver: bridge

volumes:
  pgdata:
  gitea-data:
  twx-storage:
