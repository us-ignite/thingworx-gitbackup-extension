suite: thingworx-operator networkpolicy hardening (issue 009 - networkpolicy)
templates:
  - networkpolicy.yaml
tests:
  - it: allows health metrics ingress and DNS plus kube-apiserver egress when enabled
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.policyTypes[0]
          value: Ingress
      - equal:
          path: spec.policyTypes[1]
          value: Egress
      - contains:
          path: spec.ingress
          content:
            ports:
              - port: 8080
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP
              - port: 8443
                protocol: TCP
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: thingworx-operator

  - it: does not render NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: appends extraEgress rules when provided
    set:
      networkPolicy.extraEgress:
        - ports:
            - port: 8080
              protocol: TCP
          to:
            - ipBlock:
                cidr: 10.0.0.0/24
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 10.0.0.0/24
