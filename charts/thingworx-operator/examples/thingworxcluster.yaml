apiVersion: thingworx.us-ignite.org/v1alpha1
kind: ThingWorxCluster
metadata:
  name: production
  namespace: thingworx
spec:
  enableHA: true
  images:
    platform: registry.example/thingworx/platform-postgres@sha256:REPLACE
    databaseInit: registry.example/thingworx/postgresql-init@sha256:REPLACE
    securityCli: registry.example/thingworx/security-tool@sha256:REPLACE
    ignite: registry.example/thingworx/ignite@sha256:REPLACE
    cxServer: registry.example/thingworx/cxserver@sha256:REPLACE
    haProxy: haproxy:3.0.10
    zookeeper: zookeeper:3.8.4
    extensionInstaller: registry.example/thingworx/extension-installer@sha256:REPLACE
  imagePullSecret: thingworx-registry
  database:
    host: postgres-ha.database.svc.cluster.local
    port: 5432
    database: thingworx
    schema: thingworx
    username: thingworx
    adminUsername: postgres
    credentials: {name: thingworx-database, key: password}
    adminCredentials: {name: thingworx-database-admin, key: password}
  storage:
    storageClassName: rwx-storage
    sharedStorageSize: 50Gi
    componentStorageSize: 20Gi
  licenseSecret: thingworx-license
  platformAdminPassword: {name: thingworx-platform-admin, key: password}
  keystorePassword: {name: thingworx-keystore, key: password}
  provisioningAppKey: {name: thingworx-app-keys, key: provisioning}
  cxServerAppKey: {name: thingworx-app-keys, key: cxserver}
  extensionImportAppKey: {name: thingworx-app-keys, key: extensions}
  extensionImportPolicy:
    entities: true
    extensibleEntities: true
    jarResources: true
    javascriptResources: true
    cssResources: true
    jsonResources: true
    webAppResources: true
  settingsConfigMap: thingworx-settings
  ingress:
    host: thingworx.example.com
    className: nginx
    certManagerIssuer: production-ca
  kafkaEnabled: false
  otelEnabled: false
