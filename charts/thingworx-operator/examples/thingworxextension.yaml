apiVersion: thingworx.us-ignite.org/v1alpha1
kind: ThingWorxExtension
metadata:
  name: example-entities
  namespace: thingworx
spec:
  clusterRef:
    name: production
  artifactPullSecret: thingworx-registry
  artifact:
    repository: registry.example/thingworx/extensions/example-entities
    digest: sha256:REPLACE_WITH_64_HEX_DIGEST
    expectedName: ExampleEntities
    expectedVersion: 1.0.0
  importPolicy:
    entities: true
  dependsOn: []
