apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: thingworxextensions.thingworx.us-ignite.org
spec:
  group: thingworx.us-ignite.org
  names:
    kind: ThingWorxExtension
    listKind: ThingWorxExtensionList
    plural: thingworxextensions
    singular: thingworxextension
    shortNames: [twxext]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [clusterRef, artifact]
              properties:
                clusterRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                artifact:
                  type: object
                  required: [repository, digest]
                  properties:
                    repository: {type: string}
                    digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                    expectedName: {type: string}
                    expectedVersion: {type: string}
                importPolicy:
                  type: object
                  properties:
                    entities: {type: boolean, default: true}
                    extensibleEntities: {type: boolean, default: false}
                    jarResources: {type: boolean, default: false}
                    javascriptResources: {type: boolean, default: false}
                    cssResources: {type: boolean, default: false}
                    jsonResources: {type: boolean, default: false}
                    webAppResources: {type: boolean, default: false}
                dependsOn:
                  type: array
                  items: {type: string}
                artifactPullSecret: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
                installerJob: {type: string}
                lastAttemptedDigest: {type: string}
                observedDigest: {type: string}
                importedName: {type: string}
                importedVersion: {type: string}
                requestedRestart: {type: string}
                lastAttemptedFingerprint: {type: string}
                observedFingerprint: {type: string}
                previousDigest: {type: string}
                observedGeneration: {type: integer, format: int64}
      subresources:
        status: {}
