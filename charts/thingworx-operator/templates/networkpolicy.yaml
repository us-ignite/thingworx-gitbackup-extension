{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "thingworx-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "thingworx-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "thingworx-operator.name" . }}
  policyTypes:
    - Ingress
    - Egress
  # Allow the health/metrics endpoint for kubelet probes and Prometheus scraping.
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS (kube-dns / CoreDNS) for service discovery
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow kube-apiserver (operator needs Jobs/Services/Leases CRUD via API)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
{{- with .Values.networkPolicy.extraEgress }}
{{ toYaml . | nindent 4 }}
{{- end }}
{{- end }}
