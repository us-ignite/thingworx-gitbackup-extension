{{- if .Values.networkPolicy.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "thingworx-operator.fullname" . }}-test-hardening"
  labels:
    app.kubernetes.io/name: {{ include "thingworx-operator.name" . }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  serviceAccountName: {{ include "thingworx-operator.fullname" . }}
  containers:
    - name: test-hardening
      image: busybox:1.36
      command: ['sh', '-c', 'echo "security hardening test pod: readOnlyRootFilesystem emptyDir /tmp and NetworkPolicy present" && echo ok']
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  restartPolicy: Never
{{- end }}
