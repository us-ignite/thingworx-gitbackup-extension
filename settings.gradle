plugins {
    id 'org.danilopianini.gradle-pre-commit-git-hooks' version '2.1.22'
}

rootProject.name = 'ThingWorxExtensions'

include ':libraries:thingworx-dap'
include ':libraries:thingworx-dap-runtime'
include ':extensions:jgit'

// The generated prepare-commit-msg hook delegates to this tracked script. This
// runs after Git has the message but before it snapshots the index into the
// commit, so hook-owned version changes are included in the same commit.
gitHooks { extension ->
    extension.with {
        hook('prepare-commit-msg') { context ->
            context.from(file('.githooks/versioning-commit-msg.sh'))
            context.tasks('spotlessCheck', [] as String[], true)
        }
        createHooks(true)
    }
}
