<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitBackup Widgets - Dev Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #333; }
    nav { background: #1976d2; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
    nav h1 { font-size: 18px; font-weight: 500; }
    nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; cursor: pointer; }
    nav a:hover { color: white; }
    nav a.active { color: white; font-weight: 600; border-bottom: 2px solid white; }
    main { max-width: 800px; margin: 24px auto; padding: 0 24px; }
    .demo-panel { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .demo-panel h2 { font-size: 16px; font-weight: 500; margin-bottom: 16px; color: #1976d2; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
    .note { font-size: 12px; color: #999; margin-top: 8px; background: #f5f5f5; padding: 8px 12px; border-radius: 4px; }
    .note code { background: #eee; padding: 1px 4px; border-radius: 2px; }
    .actions { margin: 16px 0; display: flex; gap: 8px; }
    input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button.primary { background: #1976d2; color: white; }
    button.secondary { background: #f5f5f5; color: #333; border: 1px solid #ccc; }
  </style>
  <script type="module" crossorigin src="/assets/main-2DbXx4eI.js"></script>
</head>
<body>
  <nav>
    <h1>GitBackup Widgets</h1>
    <a class="active" href="#pull" onclick="showPanel('pull')">Pull</a>
    <a href="#push" onclick="showPanel('push')">Push</a>
    <a href="#checkout" onclick="showPanel('checkout')">Checkout</a>
    <a href="#delete" onclick="showPanel('delete')">Delete</a>
    <a href="#about" onclick="showPanel('about')">About</a>
    <a href="#version" onclick="showPanel('version')">Version</a>
    <a href="#loading" onclick="showPanel('loading')">Loading</a>
  </nav>
  <main>
    <div class="note">Set your GitThing name below (in real usage this comes from ThingWorx binding). These demos call ThingWorx services via REST.</div>
    <div class="actions">
      <input id="gitThing" placeholder="GitThing name (e.g. GitRepository)" value="GitRepository" />
      <button class="secondary" onclick="location.reload()">Reload</button>
    </div>

    <div id="panel-pull" class="demo-panel"><h2>Git Pull</h2><git-pull gitThing="GitRepository"></git-pull></div>
    <div id="panel-push" class="demo-panel" style="display:none"><h2>Git Push</h2><git-push gitThing="GitRepository"></git-push></div>
    <div id="panel-checkout" class="demo-panel" style="display:none"><h2>Git Checkout</h2><git-checkout gitThing="GitRepository"></git-checkout></div>
    <div id="panel-delete" class="demo-panel" style="display:none"><h2>Git Delete</h2><git-delete gitThing="GitRepository" thingName="GitRepository"></git-delete></div>
    <div id="panel-about" class="demo-panel" style="display:none"><h2>Git About</h2><git-about></git-about></div>
    <div id="panel-version" class="demo-panel" style="display:none"><h2>Git Version</h2><git-version></git-version></div>
    <div id="panel-loading" class="demo-panel" style="display:none"><h2>Git Loading</h2><git-loading message="Processing..."></git-loading></div>
  </main>
  <script>
    function showPanel(name) {
      document.querySelectorAll('.demo-panel').forEach(p => p.style.display = 'none');
      document.getElementById('panel-' + name).style.display = 'block';
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      document.querySelector('nav a[href="#' + name + '"]')?.classList.add('active');
      const input = document.getElementById('gitThing');
      document.querySelectorAll('[gitThing]').forEach(el => el.setAttribute('gitThing', input.value));
    }
    document.getElementById('gitThing')?.addEventListener('change', function() {
      document.querySelectorAll('[gitThing]').forEach(el => el.setAttribute('gitThing', this.value));
    });
  </script>
</body>
</html>
