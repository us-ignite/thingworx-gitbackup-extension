plugins {
    id 'java-library'
    id 'eclipse'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    main { java.srcDirs = ['src']; java.exclude '**/test/**/*.java' }
    test { java.srcDirs = ['src']; java.include '**/test/**/*.java' }
}

repositories { mavenCentral() }

dependencies {
    api 'org.testcontainers:testcontainers:2.0.5'
    api 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

tasks.named('test') {
    useJUnitPlatform()
    // Repo rule: containerized tests (and their image builds) only run on
    // explicit test invocations, never as part of `build`/`check`. Gradle runs
    // `dependsOn` tasks even when this test is disabled, so both must be gated.
    def isTestInvocation = gradle.startParameter.taskNames.any { taskName ->
        ['test', 'testAll', 'integrationTest', 'verify'].any { lifecycle -> taskName == lifecycle || taskName.endsWith(":${lifecycle}") }
    }
    enabled = isTestInvocation
    if (isTestInvocation) {
        dependsOn(':images:platform:build101')
        dependsOn(':images:security-tool:buildSecurityTool_10.1')
    }
    def explicitDbInit = System.getProperty('test.dbInitScript') ?: project.findProperty('test.dbInitScript')
    def dbInitPath = explicitDbInit != null ? new File(explicitDbInit.toString()).absolutePath : new File(rootDir, 'apps/thingworx-jgit-extension/scripts/db-init-wrapper.sh').absolutePath
    systemProperty 'test.dbInitScript', dbInitPath
    def explicitLicense = System.getProperty('test.licenseFile') ?: project.findProperty('test.licenseFile')
    if (explicitLicense != null) {
        def licensePath = new File(explicitLicense.toString()).absolutePath
        systemProperty 'test.licenseFile', licensePath
        systemProperty 'test.licenseFile.explicit', 'true'
    } else {
        def defaultLicense = new File(rootDir, 'vendor/license.bin')
        if (defaultLicense.exists() && defaultLicense.canRead()) {
            systemProperty 'test.licenseFile', defaultLicense.absolutePath
        }
    }
    systemProperty 'test.dbInitImage', System.getProperty('test.dbInitImage') ?: 'ghcr.io/us-ignite/thingworx/postgres-init:10.1.2-openjdk'
    systemProperty 'test.platformImage', System.getProperty('test.platformImage') ?: 'ghcr.io/us-ignite/thingworx/platform-postgres:10.1.2-openjdk'
    systemProperty 'test.postgresImage', System.getProperty('test.postgresImage') ?: 'postgres:16'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}

tasks.register('testAll') {
    description = 'Run all containerized integration tests'
    group = 'verification'
    dependsOn tasks.named('test')
}
