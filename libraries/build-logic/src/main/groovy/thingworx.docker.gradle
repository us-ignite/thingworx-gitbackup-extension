// Conventions for image projects: shared staging locations, the licence-scanning
// DockerPush default, and staging cleanup. Image build steps are the typed tasks in
// thingworx.docker (ExtractVendorArchive, StageFile, VendorBuildScript, PlatformImageBuild,
// DockerBuild, DockerPush); per-image build files hold only their version tables.
import thingworx.docker.DockerPush
import thingworx.docker.ImagesExtension

plugins {
    id 'base'
    id 'thingworx.base'
}

def images = extensions.create('thingworxImages', ImagesExtension)
images.stagingRoot.convention(rootProject.layout.projectDirectory.dir('images/build'))
images.vendorDir.convention(rootProject.layout.projectDirectory.dir('vendor'))

tasks.withType(DockerPush).configureEach {
    licenceScanner.convention(rootProject.layout.projectDirectory.file('images/scripts/check-image-licenses.py'))
}

tasks.register('cleanImages', Delete) {
    description = 'Delete all extracted vendor files and build contexts'
    group = 'cleanup'
    delete images.stagingRoot
}

tasks.register('cleanVendor') {
    description = 'Clean build outputs (alias for cleanImages)'
    group = 'cleanup'
    dependsOn 'cleanImages'
}
