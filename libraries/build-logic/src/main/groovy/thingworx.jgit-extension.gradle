// Single-version ThingWorx extension build, applied once per supported
// ThingWorx version by the thin versions/<tw>/build.gradle projects.
//
// Convention: the version comes from the project directory name
// (e.g. versions/9.6 -> '9.6'). Shared sources, junit.properties and
// .version live in the parent project (apps/thingworx-jgit-extension); each
// version project gets its own isolated build/ outputs. Every project is a
// plain single-sourceSet Java project so IDEs import it natively.
//
// Inputs from other projects arrive through configurations, never by path:
//   thingworxUi       <- parent's generated GIT mashups (ui-entities variant)
//   embeddedClasses   <- :libraries:thingworx-dap-runtime jar (bundled into the extension jar)
// Outputs: thingworxExtensionElements (the extension zip) and
//          thingworxJavadocElements (the javadoc directory).
import thingworx.TestInvocation
import thingworx.ThingworxArtifacts
import thingworx.TwxVersions
import thingworx.docker.RequireDockerImages
import thingworx.tasks.ExtensionMetadata
import thingworx.tasks.FileSystemProperty

plugins {
    id 'thingworx.java'
    id 'thingworx.eclipse'
    id 'thingworx.testing'
    id 'thingworx.test-fixtures'
    id 'thingworx.sdk'
    id 'thingworx.dap'
    id 'thingworx.extension-artifact'
}

def ver = project.projectDir.name
def cfg = TwxVersions.SDK_CONFIGS[ver]
if (cfg == null) {
    throw new GradleException(
        "thingworx.jgit-extension applied to unexpected directory '${project.projectDir}'. " +
        "Expected versions/<one of ${TwxVersions.ALL}>.")
}
def sanitized = TwxVersions.sanitize(ver)
def sharedDir = project.parent.projectDir
def sharedSrcDir = new File(sharedDir, 'src')

def packageVersion = providers.fileContents(project.parent.layout.projectDirectory.file('.version')).asText.map { it.trim() }.get()
def packageVendor = 'US Ignite / Ryan Guild'
def extensionJar = 'jgitextension.jar'
def packageName = "JGitExtension-v${packageVersion}-${cfg.outputSuffix}"
def dapEntityTypes = ['DataShapes', 'ThingShapes', 'ThingTemplates', 'Things', 'Projects']

ext.twxVersion = ver
ext.packageVersion = packageVersion
ext.packageName = packageName

thingworxSdk.version = ver
thingworxDap.packageVersion = packageVersion
thingworxDap.minimumThingWorxVersion = cfg.minTwVersion

eclipse {
    project {
        name = "thingworx-jgit-extension-${ver}"
    }
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.removeAll {
                    it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder && it.path != 'build/generated/sources/annotationProcessor/java/main'
                }
                def main = new org.gradle.plugins.ide.eclipse.model.SourceFolder('../../src', 'bin/main')
                main.excludes = ['**/test/**']
                main.entryAttributes['gradle_scope'] = 'main'
                main.entryAttributes['gradle_used_by_scope'] = 'main,test'
                classpath.entries.add(main)
                def test = new org.gradle.plugins.ide.eclipse.model.SourceFolder('../../src', 'bin/test')
                test.includes = ['org/us_ignite/thingworx/jgit/test/**/*.java']
                test.entryAttributes['gradle_scope'] = 'test'
                test.entryAttributes['gradle_used_by_scope'] = 'test'
                test.entryAttributes['test'] = 'true'
                classpath.entries.add(test)
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir sharedSrcDir
            exclude '**/test/**'
        }
    }
    test {
        java {
            srcDir sharedSrcDir
            include 'org/us_ignite/thingworx/jgit/test/**/*.java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // Runtime dependencies packaged into lib/common of the extension zip.
    packageDependencies
    implementation.extendsFrom packageDependencies
    // Library classes merged into the extension jar itself.
    embeddedClasses {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}
def thingworxUi = ThingworxArtifacts.incoming(project, 'thingworxUi', ThingworxArtifacts.UI_ENTITIES)

dependencies {
    implementation thingworxSdk.jars
    implementation project(':libraries:thingworx-dap-runtime')
    embeddedClasses project(':libraries:thingworx-dap-runtime')
    add(thingworxUi.name, project(project.parent.path))

    packageDependencies('org.eclipse.jgit:org.eclipse.jgit:7.6.0.202603022253-r') {
        exclude group: 'commons-codec'
        exclude group: 'org.slf4j'
    }
    // SSH transport for JGit (Apache MINA sshd). Core JGit has no SSH implementation.
    packageDependencies('org.eclipse.jgit:org.eclipse.jgit.ssh.apache:7.6.0.202603022253-r') {
        exclude group: 'org.slf4j'
        exclude group: 'org.bouncycastle'
        exclude group: 'commons-codec'
    }
    packageDependencies('org.bouncycastle:bcpg-jdk18on:1.72') {
        exclude group: 'org.slf4j'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    packageDependencies 'com.googlecode.javaewah:JavaEWAH:1.2.3'

    // Compile-only: already available in ThingWorx platform
    implementation 'commons-codec:commons-codec:1.22.0'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation('org.bouncycastle:bcprov-jdk18on:1.72') {
        exclude group: 'org.slf4j'
    }

    // Test dependencies (not packaged since not in packageDependencies)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation project(':libraries:thingworx-testcontainers')
    testImplementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'
}

tasks.named('check') {
    dependsOn ':examples:thingworx-dap-usage:verifyDapExample'
}

def jar = tasks.named('jar', Jar) {
    archiveFileName = extensionJar
    from({ configurations.embeddedClasses.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest {
        attributes 'Built-By': packageVendor,
                   'Build-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
        attributes 'Package-Title': packageName,
                   'Package-Version': packageVersion,
                   'Package-Vendor': packageVendor,
                   'ThingWorx-SDK-Version': ver
    }
}

def dapOutput = files(thingworxDap.outputDir) { builtBy 'compileJava' }

def extensionMetadata = tasks.register('extensionMetadata', ExtensionMetadata) {
    description = "Write metadata.xml listing the packaged jars for ThingWorx ${ver}"
    group = 'build'
    generatedEntities = thingworxDap.outputDir
    dependsOn 'compileJava'
    jars.from(jar, configurations.packageDependencies)
    outputFile = layout.buildDirectory.file('extension-metadata/metadata.xml')
}

def prepPackage = tasks.register('prepPackage', Sync) {
    description = "Stage extension zip contents for ThingWorx ${ver}"
    group = 'build'
    into layout.buildDirectory.dir('zip')
    from(jar) { into 'lib/common' }
    from(configurations.packageDependencies) { into 'lib/common' }
    from(extensionMetadata)
    dapEntityTypes.each { entityType ->
        from(dapOutput) {
            include "${entityType}/*.xml"
            eachFile { it.path = "Entities/${entityType}_${it.name}" }
            includeEmptyDirs = false
        }
    }
    // Static (pre-built) UI entities shipped verbatim, e.g. mashups and menus.
    from(thingworxUi) {
        include '*.xml'
        into 'Entities'
    }
}

def packageExtension = tasks.register('packageExtension', Zip) {
    description = "Assemble extension zip for ThingWorx ${ver}"
    group = 'build'
    archiveFileName = "${packageName}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from prepPackage
}
artifacts.add('thingworxExtensionElements', packageExtension)

def javadocElements = ThingworxArtifacts.outgoing(project, 'thingworxJavadocElements', ThingworxArtifacts.JAVADOC)
artifacts.add(javadocElements.name, layout.buildDirectory.dir('docs/javadoc')) {
    builtBy 'javadoc'
}

tasks.named('build') {
    dependsOn packageExtension
}

// -PuseExistingImages: images were provided another way (CI pulls them from the
// GHCR cache), so skip the builds and just verify they exist.
def useExistingImages = project.hasProperty('useExistingImages')
def requireTestImages = tasks.register('requireTestImages', RequireDockerImages) {
    description = "Verify the ThingWorx ${ver} test images exist locally"
    images = [cfg.platformImage, cfg.dbInitImage, cfg.securityImage]
}

tasks.named('test', Test) {
    description = "Run tests against ThingWorx ${ver} (${cfg.outputSuffix})"
    group = 'verification'
    // Tests resolve helper scripts via relative paths (scripts/...), so run
    // from the shared directory just like the old single-project layout did.
    workingDir = sharedDir
    jvmArgumentProviders.add(objects.newInstance(FileSystemProperty).tap {
        name = 'test.extensionZip'
        file = packageExtension.flatMap { it.archiveFile }
    })
    // Image builds are test-only (see TestInvocation): Gradle runs `dependsOn`
    // tasks even for a disabled test, so plain `build` must not reach them.
    if (useExistingImages) {
        dependsOn requireTestImages
    } else if (TestInvocation.requested(gradle)) {
        dependsOn ":images:platform:build${sanitized}"
        dependsOn ":images:security-tool:buildSecurityTool_${ver}"
    }
    systemProperty 'test.dbInitImage', System.getProperty('test.dbInitImage') ?: cfg.dbInitImage
    systemProperty 'test.platformImage', System.getProperty('test.platformImage') ?: cfg.platformImage
    systemProperty 'test.postgresImage', System.getProperty('test.postgresImage') ?: cfg.postgresImage
    systemProperty 'test.postgresHostAuth', System.getProperty('test.postgresHostAuth') ?: cfg.postgresHostAuth
    systemProperty 'test.postgresPasswordEncryption', System.getProperty('test.postgresPasswordEncryption') ?: cfg.postgresPasswordEncryption
    def junitProps = new Properties()
    new File(sharedDir, 'junit.properties').withInputStream { junitProps.load(it) }
    junitProps.each { k, v -> systemProperty k, v }
    def parallelismOverride = project.findProperty('testParallelism')
    if (parallelismOverride != null) {
        def parsed = parallelismOverride.toString().trim()
        if (!parsed.matches(/^[1-9][0-9]*$/)) {
            throw new GradleException("testParallelism must be a positive integer, got '${parallelismOverride}'")
        }
        systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', parsed
    }
    def maxForksOverride = project.findProperty('testMaxParallelForks')
    if (maxForksOverride != null) {
        def parsed = maxForksOverride.toString().trim()
        if (!parsed.matches(/^[1-9][0-9]*$/)) {
            throw new GradleException("testMaxParallelForks must be a positive integer, got '${maxForksOverride}'")
        }
        maxParallelForks = parsed.toInteger()
    } else {
        maxParallelForks = 4
    }
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showCauses = true
        showStackTraces = true
    }
}

tasks.named('clean', Delete) {
    delete 'bin'
}
