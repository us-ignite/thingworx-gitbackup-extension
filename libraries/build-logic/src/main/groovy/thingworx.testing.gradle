// Repo rule: tests (unit, integration, containerized) only run on explicit
// test invocations (`test`/`testAll`/`integrationTest`/`verify`).
// `build`/`check`/`checkAll` are assemble/package only and must not stand up
// containers, clusters, or image builds.
tasks.withType(Test).configureEach {
    def testInvocation = gradle.startParameter.taskNames.any { taskName ->
        ['test', 'testAll', 'integrationTest', 'verify'].any { lifecycle ->
            taskName == lifecycle || taskName.endsWith(":${lifecycle}")
        }
    }
    enabled = testInvocation
    testLogging {
        events 'failed'
        exceptionFormat = 'short'
        showStandardStreams = false
    }
}
