// Repo rule: tests (unit, integration, containerized) only run on explicit
// test invocations (`test`/`testAll`/`integrationTest`/`verify`); see TestInvocation.
// `build`/`check`/`checkAll` are assemble/package only and must not stand up
// containers, clusters, or image builds.
import thingworx.TestInvocation

def testInvocation = TestInvocation.requested(gradle)
tasks.withType(Test).configureEach {
    enabled = testInvocation
    testLogging {
        events 'failed'
        exceptionFormat = 'short'
        showStandardStreams = false
    }
}
