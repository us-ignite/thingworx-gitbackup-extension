// ThingWorx Extension SDK: `thingworxSdk.version` (default -PtwxVersion, else the
// minimum supported SDK) selects the vendor zip; `unpackSdk` extracts it and
// `thingworxSdk.jars` carries that task dependency, e.g.
//   dependencies { compileOnly thingworxSdk.jars }
import thingworx.TwxVersions
import thingworx.java.ThingworxSdkExtension

def sdk = extensions.create('thingworxSdk', ThingworxSdkExtension)
sdk.version.convention(providers.gradleProperty('twxVersion').orElse(TwxVersions.MINIMUM_TWX_SDK))

def sdkZip = sdk.version.map { String v ->
    def name = TwxVersions.SDK_ZIPS[v]
    if (name == null) throw new GradleException("Unknown twxVersion '${v}'. Valid values: ${TwxVersions.SDK_ZIPS.keySet()}")
    rootProject.layout.projectDirectory.file("vendor/${name}")
}
def extractDir = sdk.version.flatMap { v -> layout.buildDirectory.dir("sdk-${v}") }

def unpackSdk = tasks.register('unpackSdk', Sync) {
    description = 'Extract the ThingWorx Extension SDK jars'
    group = 'build'
    from(sdkZip.map { zipTree(it) })
    into extractDir
    exclude '**/thingworx-javadocs*'
    exclude 'Common/'
}

sdk.jars.from(extractDir.map { dir -> fileTree(dir) { include '*.jar' } })
sdk.jars.builtBy(unpackSdk)
