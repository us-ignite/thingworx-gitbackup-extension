// Shared GitHub Packages publishing. Per-project build files only declare
// ext.publishingArtifactId / publishingName / publishingDescription.
plugins {
    id 'maven-publish'
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/us-ignite/thingworx-gitbackup-extension')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.ext.has('publishingArtifactId') ? project.ext.publishingArtifactId : project.name
            pom {
                name = project.ext.has('publishingName') ? project.ext.publishingName : project.name
                description = project.ext.has('publishingDescription') ? project.ext.publishingDescription : project.name
                url = 'https://github.com/us-ignite/thingworx-gitbackup-extension'
                licenses { license { name = 'MIT License'; url = 'https://opensource.org/license/mit' } }
                scm {
                    connection = 'scm:git:https://github.com/us-ignite/thingworx-gitbackup-extension.git'
                    url = 'https://github.com/us-ignite/thingworx-gitbackup-extension'
                }
            }
        }
    }
}
