plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'com.diffplug.spotless'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

version = file('.version').text.trim()

def twxVersion = project.findProperty('twxVersion') ?: '9.6'
def sdkZipNames = [
    '9.6': 'MED-61098-CD-096_9-6-0_ThingWorx-Extension-SDK-9-6-0.zip',
    '9.7': 'MED-61098-CD-097_9-7-0_ThingWorx-Extension-SDK-9-7-0.zip',
    '10.1': 'MED-61098-CD-101_10-1-0_ThingWorx-Extension-SDK-10-1-0.zip'
]
def sdkZip = file("${rootDir}/extensions/jgit/vendor/${sdkZipNames[twxVersion]}")
def sdkExtractDir = file("${buildDir}/sdk-${twxVersion}")

tasks.register('unpackSdk', Copy) {
    from zipTree(sdkZip)
    into sdkExtractDir
    exclude '**/thingworx-javadocs*'
    exclude 'Common/'
}

dependencies {
    api project(':libraries:thingworx-dap')
    compileOnly fileTree(dir: sdkExtractDir, include: '*.jar')
    testImplementation fileTree(dir: sdkExtractDir, include: '*.jar')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('unpackSdk')
    options.compilerArgs += ['-Xlint:deprecation']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def dapExampleOutputDir = file("${buildDir}/generated/dap-example")
tasks.named('compileTestJava') {
    outputs.dir dapExampleOutputDir
    doFirst { delete dapExampleOutputDir }
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += [
        "-Adap.output=${dapExampleOutputDir.absolutePath}",
        '-Adap.packageVersion=1.0.0',
        '-Adap.minimumThingWorxVersion=9.6.0'
    ]
}

dependencies {
    annotationProcessor project(':libraries:thingworx-dap')
}

tasks.register('verifyDapExample') {
    description = 'Compile the DAP example and verify its generated ThingWorx XML'
    group = 'verification'
    dependsOn tasks.named('compileTestJava')
    doLast {
        def shape = new XmlSlurper().parse(new File(dapExampleOutputDir, 'DataShapes/GIT.ExampleCommit.DataShape.xml')).DataShapes.DataShape
        assert shape.@name.text() == 'GIT.ExampleCommit.DataShape'
        assert shape.FieldDefinitions.FieldDefinition*.@name*.text() == ['CommitID', 'Message']
        def wrapper = new XmlSlurper().parse(new File(dapExampleOutputDir, 'DataShapes/GIT.ExampleCommit.ServiceResult.DataShape.xml')).DataShapes.DataShape
        assert wrapper.FieldDefinitions.FieldDefinition.find { it.@name.text() == 'Result' }.@'aspect.dataShape'.text() == 'GIT.ExampleCommit.DataShape'
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle { target 'build.gradle' }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/us-ignite/thingworx-gitbackup-extension')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'thingworx-dap-runtime'
            pom {
                name = 'ThingWorx DAP Runtime'
                description = 'ThingWorx runtime helpers for ThingWorx DAP.'
                url = 'https://github.com/us-ignite/thingworx-gitbackup-extension'
                licenses { license { name = 'MIT License'; url = 'https://opensource.org/license/mit' } }
                scm {
                    connection = 'scm:git:https://github.com/us-ignite/thingworx-gitbackup-extension.git'
                    url = 'https://github.com/us-ignite/thingworx-gitbackup-extension'
                }
            }
        }
    }
}
