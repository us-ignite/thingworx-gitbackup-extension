// Aggregator over the per-version subprojects in versions/<tw>/ (each a plain
// single-version Java project sharing this directory's src/, built by the
// thingworx.jgit-extension plugin). This project owns formatting of the shared
// src/, the generated GIT mashups (ui/), the extension packs, the
// workspace-wide aliases, and the local development stack tasks.
//
// Everything produced elsewhere arrives through configurations:
//   jgitExtension_<tw>  <- :versions:<tw> extension zip
//   widgetExtensions    <- the four widget extension zips
//   bmWidgetsRelease    <- the pinned BMCoreUIWidgets release (type declarations)
//   defaultJavadoc      <- the default version's javadoc
import thingworx.ThingworxArtifacts
import thingworx.TwxVersions
import thingworx.dev.CreateGiteaRepository
import thingworx.dev.DevSetupSummary
import thingworx.dev.InstallThingworxExtensions
import thingworx.dev.InvokeThingworxServices
import thingworx.dev.MakeDevPackage
import thingworx.dev.MaterializeLicense
import thingworx.dev.RegisterDevGpgKey
import thingworx.dev.SaveMashups
import thingworx.dev.WaitForHttp
import thingworx.tasks.VerifiedDownload

plugins {
    id 'base'
    id 'thingworx.base'
    id 'thingworx.spotless'
}

defaultTasks 'clean', 'packageExtension'

def defaultTwx = TwxVersions.DEFAULT
def versionPath = { String ver -> ":apps:thingworx-jgit-extension:v${TwxVersions.sanitize(ver)}" }
def packageVersion = providers.fileContents(layout.projectDirectory.file('.version')).asText.map { it.trim() }.get()
ext.packageVersion = packageVersion

spotless {
    groovyGradle {
        target 'build.gradle', 'versions/*/build.gradle'
    }
}

// ---------------------------------------------------------------------------
// Incoming artifacts
// ---------------------------------------------------------------------------
def versionExtensions = TwxVersions.ALL.collectEntries { ver ->
    def conf = ThingworxArtifacts.incoming(project, "jgitExtension_${TwxVersions.sanitize(ver)}", ThingworxArtifacts.EXTENSION)
    dependencies.add(conf.name, project(versionPath(ver)))
    [(ver): conf]
}
def widgetExtensions = ThingworxArtifacts.incoming(project, 'widgetExtensions', ThingworxArtifacts.EXTENSION)
def bmWidgetsRelease = ThingworxArtifacts.incoming(project, 'bmWidgetsRelease', ThingworxArtifacts.EXTENSION)
def defaultJavadoc = ThingworxArtifacts.incoming(project, 'defaultJavadoc', ThingworxArtifacts.JAVADOC)

// Separately installable widget extensions the GIT mashups use. Installing
// JGitExtension alone leaves screens such as History blank.
[':apps:bmwidgets-extension', ':apps:aggridwidget3-extension', ':apps:git-history-widget-extension', ':apps:markdown-widget-extension'].each {
    dependencies.add(widgetExtensions.name, project(it))
}
dependencies.add(bmWidgetsRelease.name, project(':apps:bmwidgets-extension'))
dependencies.add(defaultJavadoc.name, project(versionPath(defaultTwx)))

// ---------------------------------------------------------------------------
// Generated GIT mashups: TypeScript helpers and CSS embedded into ui/*.xml
// (generated in place; the results are committed).
// ---------------------------------------------------------------------------
def ui = layout.projectDirectory.dir('ui')
def mashup = { String name -> ui.file("Mashups_GIT.Mashup.${name}.xml") }

tasks.register('installUiBuildDependencies', Exec) {
    description = 'Install the pinned TypeScript compiler used to embed the mashup helpers'
    group = 'development'
    workingDir ui
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
    inputs.files(ui.file('package.json'), ui.file('package-lock.json')).withPathSensitivity(PathSensitivity.NAME_ONLY)
    outputs.file ui.file('node_modules/typescript/lib/typescript.js')
}

tasks.register('syncUiTypeDeclarations', Sync) {
    description = 'Refresh the BMCoreUIWidgets TypeScript declarations from the pinned extension release (ThingWorx and jQuery types come from npm)'
    group = 'development'
    inputs.files(bmWidgetsRelease)
    from({ bmWidgetsRelease.collect { zipTree(it) } }) {
        include 'ui/BMCoreUIWidgets/TWRuntimeWidget.d.ts'
        includeEmptyDirs = false
        eachFile { details -> details.path = 'BMCoreUIWidgets.d.ts' }
    }
    into ui.dir('src/types')
    // Hand-maintained helper types that the release only ships inside its Thingworx.d.ts.
    preserve { include 'BMTypescriptHelper.d.ts' }
}

// [task, helper source, target mashup, helper id]; all run embed-typescript-helper.js.
def typeScriptHelpers = [
    ['embedRepositorySettings', 'RepositorySettings', 'RepositorySettings', 'repository-settings-helper'],
    ['embedUserIdentity', 'UserIdentity', 'Settings', 'user-identity-helper'],
    ['embedRepositoryCreate', 'RepositoryCreate', 'RepositoryCreate', 'repository-create-helper'],
    ['embedGitHeader', 'GitHeader', 'GitHeader', 'git-header-helper'],
    ['embedMergeControls', 'MergeControls', 'MergeControls', 'mergecontrols-helper'],
    ['embedConflictResolution', 'ConflictResolution', 'ConflictResolution', 'conflictresolution-helper'],
    ['embedBranchesMergeControls', 'MergeControls', 'Branches', 'mergecontrols-helper'],
    ['embedGitHelper', 'GitHelper', 'Branches', 'BMTypescriptClassHost-50'],
]
typeScriptHelpers.each { taskName, helper, target, id ->
    tasks.register(taskName, Exec) {
        description = "Embed the ${helper} TypeScript helper in the ${target} mashup"
        group = 'build'
        dependsOn 'installUiBuildDependencies'
        workingDir ui
        commandLine 'node', 'embed-typescript-helper.js', "src/${helper}.ts", "Mashups_GIT.Mashup.${target}.xml", id
        inputs.files(ui.file("src/${helper}.ts"), ui.file('embed-typescript-helper.js'), ui.file('package-lock.json'))
                .withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.file mashup(target)
        mustRunAfter 'embedHomeNavigation'
    }
}
tasks.named('embedGitHelper') {
    dependsOn 'syncUiTypeDeclarations'
    // Both write Branches.xml.
    mustRunAfter 'embedBranchesMergeControls'
}

tasks.register('embedConflictMashups') {
    description = 'Embed the merge-controls and conflict-resolution helpers'
    group = 'build'
    dependsOn 'embedMergeControls', 'embedConflictResolution', 'embedBranchesMergeControls'
}

tasks.register('embedHomeNavigation', Exec) {
    description = 'Embed the Git Home navigation helper'
    group = 'build'
    dependsOn 'installUiBuildDependencies'
    workingDir ui
    commandLine 'node', 'embed-home-navigation.js'
    inputs.files(ui.file('src/HomeNavigation.ts'), ui.file('src/GitResultPopover.ts'), ui.file('embed-home-navigation.js'), ui.file('package-lock.json'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.files(['Home', 'RepositoryRow', 'Changes', 'Settings'].collect { mashup(it) })
}

def cssMashups = ['Home', 'RepositoryRow', 'GitHeader', 'Repository', 'Changes', 'Branches', 'History', 'Log', 'Reflog',
                  'ExtensionLog', 'RepositorySettings', 'RepositoryCreate', 'Settings', 'MergeControls', 'ConflictResolution']
tasks.register('embedMashupCss', Exec) {
    description = 'Embed shared and page CSS in the GIT mashups'
    group = 'build'
    // Runs last: it rewrites every mashup the helper tasks produce.
    mustRunAfter typeScriptHelpers.collect { it[0] } + ['embedHomeNavigation']
    workingDir ui
    commandLine 'node', 'embed-mashup-css.js'
    inputs.files(ui.file('embed-mashup-css.js'), fileTree(ui.dir('src')) { include '*.css' }).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.files(cssMashups.collect { mashup(it) })
}

tasks.register('embedMashups') {
    description = 'Regenerate every embedded helper and stylesheet in the GIT mashups'
    group = 'build'
    dependsOn typeScriptHelpers.collect { it[0] } + ['embedHomeNavigation', 'embedMashupCss']
}

// The static UI entities (mashups and menus) consumed by every version project.
def uiEntities = tasks.register('uiEntities', Sync) {
    description = 'Collect the generated GIT mashups and menus shipped in every extension zip'
    group = 'build'
    dependsOn 'embedMashups'
    from(ui) { include '*.xml' }
    into layout.buildDirectory.dir('ui-entities')
}
ThingworxArtifacts.outgoing(project, 'thingworxUiElements', ThingworxArtifacts.UI_ENTITIES)
artifacts.add('thingworxUiElements', layout.buildDirectory.dir('ui-entities')) { builtBy uiEntities }

// ---------------------------------------------------------------------------
// Packaging
// ---------------------------------------------------------------------------
tasks.register('packageExtension') {
    description = "Assemble extension zip for default ThingWorx version (${defaultTwx})"
    group = 'build'
    // A configuration is buildable: this depends on whatever produces the default zip.
    dependsOn versionExtensions[defaultTwx]
}

tasks.register('javadoc', Sync) {
    description = "Generate Javadocs for default ThingWorx version (${defaultTwx})"
    group = 'documentation'
    from defaultJavadoc
    into layout.buildDirectory.dir('docs/javadoc')
}

def monacoVersion = 'v1.26.3'
def monacoName = "MonacoScriptEditor-prod-${monacoVersion}.zip"
def fetchMonacoEditor = tasks.register('fetchMonacoEditor', VerifiedDownload) {
    description = 'Download the pinned Monaco Script Editor widget release'
    url = "https://github.com/thingworx-field-work/MonacoEditorTWX/releases/download/${monacoVersion}/${monacoName}"
    sha256 = 'a57bb21919c7850799a239fd1e5770b641caa00e931c4e26b212192d68afa841'
    outputFile = layout.buildDirectory.file("downloads/${monacoName}")
}

// A full extension pack holds the JGit extension for one ThingWorx version plus every
// separately installable widget extension its mashups use, so releases ship a pack per version.
def packTaskName = { String ver -> "packageExtensionPack_${TwxVersions.sanitize(ver)}" }
TwxVersions.ALL.each { ver ->
    def suffix = TwxVersions.SDK_CONFIGS[ver].outputSuffix
    def extension = versionExtensions[ver]
    tasks.register(packTaskName(ver), Zip) {
        description = "Bundle the JGit extension for ThingWorx ${suffix} with its widget extensions"
        group = 'build'
        archiveFileName = "JGitExtension-pack-v${packageVersion}-${suffix}.zip"
        destinationDirectory = layout.buildDirectory.dir('packs')
        from extension
        from widgetExtensions
        from fetchMonacoEditor
        doLast {
            // A pack missing a widget installs cleanly but leaves screens blank, so fail instead.
            def expected = (extension.files + widgetExtensions.files + [fetchMonacoEditor.get().outputFile.get().asFile]).collect { it.name }
            def actual = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip -> zip.entries().collect { it.name } as Set }
            def missing = expected.findAll { !actual.contains(it) }
            if (missing) throw new GradleException("${archiveFileName.get()} is missing ${missing.join(', ')}")
        }
    }
}

tasks.register('packageExtensionPacks') {
    description = 'Build the full extension pack for every ThingWorx version'
    group = 'build'
    dependsOn TwxVersions.ALL.collect { packTaskName(it) }
}

tasks.register('packageExtensionPack', Copy) {
    description = 'Build the full extension pack for the default ThingWorx version into build/distributions'
    group = 'build'
    from tasks.named(packTaskName(defaultTwx))
    into layout.buildDirectory.dir('distributions')
}

tasks.register('buildAll', Sync) {
    description = 'Build the extension and the full extension pack for all ThingWorx versions (9.6.x, 9.7.x, 10.0.x, 10.1.x, 10.2.x) in one daemon'
    group = 'build'
    versionExtensions.values().each { from it }
    TwxVersions.ALL.each { from tasks.named(packTaskName(it)) }
    into layout.buildDirectory.dir('distributions')
}

tasks.register('testAll') {
    description = 'Run tests for all ThingWorx versions in one daemon'
    group = 'verification'
    dependsOn TwxVersions.ALL.collect { "${versionPath(it)}:test" }
}

tasks.register('checkAll') {
    description = 'Run checks for all ThingWorx versions'
    group = 'verification'
    dependsOn 'testAll'
}

tasks.named('clean', Delete) {
    delete 'bin'
}

// ---------------------------------------------------------------------------
// Local development stack (docker-compose.yml at the repository root)
// ---------------------------------------------------------------------------
def composeDir = rootProject.layout.projectDirectory
// docker-compose.yml mounts this directory into extension-init as /distributions.
def composeDistributions = layout.projectDirectory.dir("versions/${defaultTwx}/build/distributions")

tasks.register('fetchLemminx', VerifiedDownload) {
    description = 'Download Eclipse LemMinX XML Language Server uber JAR'
    group = 'development'
    def lemminxVersion = '0.31.1'
    url = "https://repo1.maven.org/maven2/org/eclipse/lemminx/org.eclipse.lemminx/${lemminxVersion}/org.eclipse.lemminx-${lemminxVersion}-uber.jar"
    outputFile = layout.buildDirectory.file('lemminx/org.eclipse.lemminx-uber.jar')
}

[
    composeUp       : [['up', '-d'], 'Start the development stack (PostgreSQL, ThingWorx, Gitea)'],
    composeDown     : [['down'], 'Stop and remove the development stack'],
    composeDownClean: [['down', '-v'], 'Stop the stack and delete all volumes'],
    composeLogs     : [['logs', '-f'], 'Follow container logs'],
].each { name, spec ->
    tasks.register(name, Exec) {
        description = spec[1]
        group = 'development'
        workingDir composeDir
        commandLine(['docker', 'compose'] + spec[0])
    }
}

tasks.register('saveChanges', SaveMashups) {
    description = 'Export the tracked GIT mashups from ThingWorx into the UI source directory'
    sourceDir = ui
    outputDir = providers.gradleProperty('mashupOutputDir').map { layout.projectDirectory.dir(it) }.orElse(ui)
    mashup = providers.gradleProperty('mashup')
}

tasks.register('materializeLicense', MaterializeLicense) {
    description = 'Create vendor/license.bin from TWX_LICENSE_B64 if it is missing'
    licenseFile = rootProject.layout.projectDirectory.file('vendor/license.bin')
}

// devSetup = the steps below, ordered by their dependencies:
//   composeUp -> waitForThingworx -> installWidgetExtensions -> installMonacoEditor
//   -> makeDevPackage -> installDevExtension -> restartThingworx -> waitForThingworxRestart
//   -> verifyMonacoEditor / verifyGitUtilityThing -> initUserExtensionProperties
//   composeUp -> waitForGitea -> createGiteaUser -> createGiteaRepository
//   -> registerDevGpgKey -> devSetup (verifies the installed version)
def health = 'http://localhost:8080/Thingworx/health'

tasks.register('waitForThingworx', WaitForHttp) {
    description = 'Wait for ThingWorx to become healthy'
    dependsOn 'composeUp'
    url = health
    label = 'ThingWorx'
    successMessage = 'ThingWorx is healthy!'
    failureMessage = 'ThingWorx did not become healthy within ~15 minutes. Check logs: docker compose logs thingworx'
}

tasks.register('installWidgetExtensions', InstallThingworxExtensions) {
    description = 'Install the widget extensions the GIT mashups use'
    dependsOn 'waitForThingworx'
    packages.from(widgetExtensions)
    distributionDir = composeDistributions
    it.composeDir = composeDir
}

tasks.register('installMonacoEditor', InstallThingworxExtensions) {
    description = 'Install the Monaco Script Editor unless a version is already installed'
    dependsOn 'waitForThingworx'
    mustRunAfter 'installWidgetExtensions'
    packages.from(fetchMonacoEditor)
    distributionDir = composeDistributions
    it.composeDir = composeDir
    skipIfInstalled = 'MonacoScriptEditor'
}

def makeDevPackage = tasks.register('makeDevPackage', MakeDevPackage) {
    description = 'Copy the default extension zip with a patch version above the installed one'
    dependsOn 'waitForThingworx'
    source.fileProvider(versionExtensions[defaultTwx].elements.map { it.first().asFile })
    destination = composeDistributions.file('JGitExtension-dev-setup.zip')
    versionFile = layout.buildDirectory.file('dev-setup/dev-version.txt')
}

tasks.register('installDevExtension', InstallThingworxExtensions) {
    description = 'Install the development JGit extension and verify GIT.Utility.Thing'
    dependsOn 'installWidgetExtensions', 'installMonacoEditor'
    packages.from(makeDevPackage.flatMap { it.destination })
    distributionDir = composeDistributions
    it.composeDir = composeDir
    verifyGitThing = true
}

tasks.register('restartThingworx', Exec) {
    description = 'Restart ThingWorx to complete extension installation'
    group = 'development'
    dependsOn 'installDevExtension'
    workingDir composeDir
    commandLine 'docker', 'compose', 'restart', 'thingworx'
}

tasks.register('waitForThingworxRestart', WaitForHttp) {
    description = 'Wait for ThingWorx to become healthy after the restart'
    dependsOn 'restartThingworx'
    url = health
    label = 'ThingWorx'
    successMessage = 'ThingWorx is healthy after upgrade!'
    failureMessage = 'ThingWorx did not become healthy after upgrade'
}

tasks.register('verifyMonacoEditor', WaitForHttp) {
    description = 'Verify the Monaco Script Editor extension is installed'
    dependsOn 'waitForThingworxRestart'
    url = 'http://localhost:8080/Thingworx/ExtensionPackages/MonacoScriptEditor'
    authenticated = true
    attempts = 1
    label = 'Monaco Script Editor'
    successMessage = 'Monaco Script Editor extension verified!'
    failureMessage = 'Monaco Script Editor installation could not be verified'
}

tasks.register('verifyGitUtilityThing', WaitForHttp) {
    description = 'Verify the extension by reaching GIT.Utility.Thing'
    dependsOn 'waitForThingworxRestart'
    url = 'http://localhost:8080/Thingworx/Things/GIT.Utility.Thing'
    authenticated = true
    attempts = 20
    intervalSeconds = 5
    label = 'GIT.Utility.Thing'
    successMessage = 'Extension verified (GIT.Utility.Thing accessible)!'
    failureMessage = 'Extension verification failed: GIT.Utility.Thing is not accessible'
}

tasks.register('initUserExtensionProperties', InvokeThingworxServices) {
    description = 'Initialize UserExtension properties for Administrator'
    dependsOn 'verifyGitUtilityThing'
    thing = 'GIT.Utility.Thing'
    serviceNames = ['InitUserExtensionProperties']
}

tasks.register('waitForGitea', WaitForHttp) {
    description = 'Wait for Gitea to answer'
    dependsOn 'composeUp'
    url = 'http://localhost:3000/'
    attempts = 15
    intervalSeconds = 3
    label = 'Gitea'
    failureMessage = 'Gitea did not become ready; cannot register the development GPG key'
}

tasks.register('createGiteaUser', Exec) {
    description = 'Create the Gitea admin user (no-op when it exists)'
    group = 'development'
    dependsOn 'waitForGitea'
    workingDir composeDir
    commandLine 'docker', 'compose', 'exec', '-u', 'git', 'gitea', 'gitea', 'admin', 'user', 'create',
            '--username', 'giteauser', '--password', 'giteapass123',
            '--email', 'test@example.com', '--admin', '--must-change-password=false'
    ignoreExitValue = true
}

tasks.register('createGiteaRepository', CreateGiteaRepository) {
    description = 'Create the Gitea test repository'
    dependsOn 'createGiteaUser'
    repository = 'jgit-test-repo'
}

tasks.register('registerDevGpgKey', RegisterDevGpgKey) {
    description = 'Ensure the development GPG key is registered with ThingWorx and Gitea'
    dependsOn 'createGiteaRepository', 'initUserExtensionProperties'
    publicKeyFile = layout.buildDirectory.file('dev-setup-gpg-public.asc')
}

tasks.register('devSetup', DevSetupSummary) {
    description = 'Build extension (default version), start dev stack, install extension on ThingWorx, and create Gitea test repo'
    dependsOn 'registerDevGpgKey', 'verifyMonacoEditor', 'fetchLemminx'
    devVersionFile = makeDevPackage.flatMap { it.versionFile }
    sourceVersion = packageVersion
}
