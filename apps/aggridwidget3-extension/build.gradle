// In-housed AG Grid 3 widget extension (extracted from Sabel Systems
// agGridWidget2-min-100.1.20.zip). IDE and runtime bundles are built from the
// recovered TypeScript sources with Vite (see the thingworx.widget-extension plugin).
plugins {
    id 'thingworx.widget-extension'
}

thingworxWidget {
    extensionName = 'agGridWidget3-extension'
    extensionVersion = '1.0.2'
    uiFolder = 'agGridWidget3'
}
