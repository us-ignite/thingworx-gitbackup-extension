// Git Markdown widget: a plain ES5 Composer file (ide/) and a Vite runtime
// bundle with marked + DOMPurify (see the thingworx.widget-extension plugin).
plugins {
    id 'thingworx.widget-extension'
}

thingworxWidget {
    extensionName = 'GitMarkdownWidget'
    extensionVersion = '1.0.0'
}

tasks.named('packageExtension', Zip) {
    from(layout.projectDirectory.dir('ide')) {
        into thingworxWidget.uiFolder.map { "ui/${it}".toString() }
    }
}
