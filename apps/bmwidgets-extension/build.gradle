// In-housed wrapper for the open-source BMCoreUIWidgets widget extension
// (github.com/thingworx-field-work/BMCoreUIWidgets, MIT license).
//
// The upstream release zip is fetched with a pinned URL and checksum, and
// published unmodified as an installable ThingWorx extension. This expresses the
// third-party widget dependency (BMTypescriptClassHost, used by the GIT mashups)
// in the build graph without vendoring sources.
import thingworx.tasks.VerifiedDownload

plugins {
    id 'thingworx.extension-artifact'
}

def bmWidgetVersion = '2.9.3'
def zipName = "BMCoreUIWidgets-min-${bmWidgetVersion}.zip"

def fetchWidgetRelease = tasks.register('fetchWidgetRelease', VerifiedDownload) {
    description = "Download the pinned BMCoreUIWidgets ${bmWidgetVersion} release artifact"
    url = "https://github.com/thingworx-field-work/BMCoreUIWidgets/releases/download/${bmWidgetVersion}/${zipName}"
    sha256 = '7cb8d7a6a3a26c9ebd0423927feb72a56e922ff1866755402dc606bf5605aba2'
    outputFile = layout.buildDirectory.file("downloads/${zipName}")
}

// Published unmodified: it already contains a valid metadata.xml and widget resources.
def packageExtension = tasks.register('packageExtension', Copy) {
    description = 'Publish the installable BMCoreUIWidgets extension zip from the pinned upstream release'
    group = 'build'
    from fetchWidgetRelease
    into layout.buildDirectory.dir('distributions')
}

artifacts.add('thingworxExtensionElements', layout.buildDirectory.file("distributions/${zipName}")) {
    builtBy packageExtension
}

tasks.named('build') { dependsOn packageExtension }
