name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  versioning:
    name: Validate Conventional Commit versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replay versioning policy
        shell: bash
        run: |
          # Validate only the commit that triggered this run. This avoids
          # replaying older, already-pushed history when new work is added.
          .github/scripts/validate-versioning.sh 'HEAD^..HEAD'

  changes:
    runs-on: ubuntu-latest
    outputs:
      jgit_version: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version
        name: Detect JGit version change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
              && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | grep -Fxq 'extensions/jgit/.version'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: versioning
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git filters
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          git config filter.twx-resources.smudge '.gitfilters/twx-resources-smudge'
          git config filter.twx-resources.clean '.gitfilters/twx-resources-clean'
          git checkout HEAD -- extensions/jgit/gradle.properties extensions/jgit/vendor/twx-resources.tar.gz.gpg

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build all extension variants
        run: ./gradlew :extensions:jgit:buildAll

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: JGitExtension-All
          path: extensions/jgit/build/distributions/
          if-no-files-found: error

  test:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.jgit_version == 'true'
    needs: [build, changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - twx: 9.6
            dbInit: devopscadit/postgresql-init-twx:platform9.6.3
            platform: devopscadit/platform-postgres:platform9.6.3
          - twx: 9.7
            dbInit: devopscadit/postgresql-init-twx:platform9.7.5
            platform: devopscadit/platform-postgres:platform9.7.5
          - twx: 10.1
            dbInit: devopscadit/postgresql-init-twx:platform10.1.0
            platform: devopscadit/platform-postgres:platform10.1.0
    steps:
      - uses: actions/checkout@v6

      - name: Configure git filters
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          git config filter.twx-resources.smudge '.gitfilters/twx-resources-smudge'
          git config filter.twx-resources.clean '.gitfilters/twx-resources-clean'
          git checkout HEAD -- extensions/jgit/gradle.properties extensions/jgit/vendor/twx-resources.tar.gz.gpg

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify Docker
        run: docker info

      - name: Run integration tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        run: ./gradlew :extensions:jgit:test -PtwxVersion=${{ matrix.twx }} -Dtest.dbInitImage='${{ matrix.dbInit }}' -Dtest.platformImage='${{ matrix.platform }}'
        timeout-minutes: 45

  publish:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.jgit_version == 'true'
    needs: [build, changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: JGitExtension-All
          path: artifacts

      - name: Create and push release tag
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < extensions/jgit/.version)
          TAG="jgit-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "JGit Extension $VERSION"
            git push origin "$TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          RELEASE_FILES=$(ls artifacts/*.zip 2>/dev/null | tr '\n' ' ')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $RELEASE_FILES
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
