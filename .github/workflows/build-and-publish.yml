name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension
        run: ./gradlew build --no-daemon

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GitBackupExtension
          path: build/distributions/GitBackupExtension.zip

      - name: Upload extension pack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GitBackupExtensionPack
          path: build/distributions/GitBackupExtensionPack.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GitBackupExtension
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: GitBackupExtensionPack
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          files: |
            artifacts/GitBackupExtension.zip
            artifacts/GitBackupExtensionPack.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
