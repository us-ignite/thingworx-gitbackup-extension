name: Publish Jars

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the committed DAP version.
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-jars
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dap_version: ${{ steps.version.outputs.changed == 'true' && steps.release.outputs.published == 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'changed=false' >> "$GITHUB_OUTPUT"
            fi
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^libraries/thingworx-dap(-runtime)?/\.version$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Check published version
        run: bash .github/scripts/release-status.sh dap libraries/thingworx-dap/.version

  publish:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.dap_version == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Register twx-file filter + decrypt vendor archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          .gitfilters/setup-twx-file
          git checkout --force HEAD -- vendor/
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify committed DAP version pair
        shell: bash
        run: |
          CORE_VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap/.version)
          RUNTIME_VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap-runtime/.version)
          test "$CORE_VERSION" = "$RUNTIME_VERSION"
      - name: Verify and publish DAP artifacts
        run: ./gradlew :libraries:thingworx-dap:check :examples:thingworx-dap-usage:verifyDapExample :libraries:thingworx-dap:publish :libraries:thingworx-dap-runtime:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push release tag
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap/.version)
          TAG="dap-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "ThingWorx DAP $VERSION"
            git push origin "$TAG"
          fi
