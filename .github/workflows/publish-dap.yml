name: Publish ThingWorx DAP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dap_version: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^libraries/thingworx-dap(-runtime)?/\.version$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: github.event_name == 'push' && needs.changes.outputs.dap_version == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure git filters
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          git config filter.twx-resources.smudge '.gitfilters/twx-resources-smudge'
          git config filter.twx-resources.clean '.gitfilters/twx-resources-clean'
          git checkout HEAD -- extensions/jgit/vendor/twx-resources.tar.gz.gpg

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify committed DAP version pair
        shell: bash
        run: |
          CORE_VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap/.version)
          RUNTIME_VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap-runtime/.version)
          test "$CORE_VERSION" = "$RUNTIME_VERSION"

      - name: Verify and publish DAP artifacts
        run: ./gradlew :libraries:thingworx-dap:check :libraries:thingworx-dap-runtime:verifyDapExample :libraries:thingworx-dap:publish :libraries:thingworx-dap-runtime:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push release tag
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < libraries/thingworx-dap/.version)
          TAG="dap-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "ThingWorx DAP $VERSION"
            git push origin "$TAG"
          fi
