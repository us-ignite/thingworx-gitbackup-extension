name: Publish Extensions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Run integration tests and publish the committed JGit version.
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-extensions
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jgit_version: ${{ steps.version.outputs.changed == 'true' && steps.release.outputs.published == 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        name: Detect JGit version change
        shell: bash
        run: |
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] \
              && [ "${{ inputs.publish }}" = "true" ]; } \
              || { [ "${{ github.event_name }}" = "push" ] \
              && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | grep -Eq '^(apps/thingworx-jgit-extension|extensions/jgit)/\.version$'; }; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Check published version
        run: bash .github/scripts/release-status.sh jgit apps/thingworx-jgit-extension/.version

  build:
    if: needs.changes.outputs.jgit_version == 'true'
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Register twx-file filter + decrypt vendor archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          .gitfilters/setup-twx-file
          git checkout --force HEAD -- vendor/
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build all extension variants
        run: ./gradlew :apps:thingworx-jgit-extension:buildAll
      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: JGitExtension-All
          path: apps/thingworx-jgit-extension/build/distributions/
          if-no-files-found: error

  test:
    if: needs.changes.outputs.jgit_version == 'true'
    needs: [build, changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        twx: ['9.6', '9.7', '10.1']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Register twx-file filter + decrypt vendor archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          .gitfilters/setup-twx-file
          git checkout --force HEAD -- vendor/
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Verify Docker
        run: docker info
      - name: Run integration tests
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          TWX_LICENSE_B64: ${{ secrets.TWX_LICENSE_B64 }}
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        run: ./gradlew :apps:thingworx-jgit-extension:test -PtwxVersion=${{ matrix.twx }}
        timeout-minutes: 45
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-${{ matrix.twx }}
          path: |
            apps/thingworx-jgit-extension/build/reports/tests/
            apps/thingworx-jgit-extension/build/test-results/
          if-no-files-found: warn

  publish:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.jgit_version == 'true'
    needs: [build, changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: JGitExtension-All
          path: artifacts
      - name: Create and push release tag
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < apps/thingworx-jgit-extension/.version 2>/dev/null || tr -d '[:space:]' < extensions/jgit/.version)
          TAG="jgit-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "JGit Extension $VERSION"
            git push origin "$TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        run: |
          RELEASE_FILES=$(ls artifacts/*.zip 2>/dev/null | tr '\n' ' ')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $RELEASE_FILES
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
