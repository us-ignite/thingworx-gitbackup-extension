name: Build and Publish Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Register twx-file filter + decrypt vendor archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          .gitfilters/setup-twx-file
          # Delete first: path checkout skips stat-clean files, so the smudge
          # filter would never run on files an earlier checkout already wrote.
          rm -f vendor/*.zip vendor/*.gz vendor/*.tar.gz
          git checkout HEAD -- vendor/

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: 21

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install MkDocs Material
        run: python -m pip install mkdocs-material

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Generate Javadocs
        run: ./gradlew :apps:thingworx-jgit-extension:javadoc

      - name: Stage generated Javadocs
        run: |
          mkdir -p apps/thingworx-jgit-extension/docs/api/javadoc
          cp -R apps/thingworx-jgit-extension/build/docs/javadoc/. apps/thingworx-jgit-extension/docs/api/javadoc/

      - name: Build documentation site
        run: mkdocs build --strict --config-file apps/thingworx-jgit-extension/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/public"

      - name: Add generated Javadocs to Pages artifact
        run: |
          mkdir -p public/api/javadoc
          cp -R apps/thingworx-jgit-extension/build/docs/javadoc/. public/api/javadoc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
