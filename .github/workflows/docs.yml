name: Build and Publish Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git filters
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          git config filter.version.smudge '.gitfilters/version-smudge'
          git config filter.version.clean '.gitfilters/version-clean'
          git config filter.twx-resources.smudge '.gitfilters/twx-resources-smudge'
          git config filter.twx-resources.clean '.gitfilters/twx-resources-clean'
          git checkout HEAD -- extensions/jgit/gradle.properties extensions/jgit/vendor/twx-resources.tar.gz.gpg

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install MkDocs Material
        run: python -m pip install mkdocs-material

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Javadocs
        run: ./gradlew :extensions:jgit:javadoc

      - name: Stage generated Javadocs
        run: |
          mkdir -p extensions/jgit/docs/api/javadoc
          cp -R extensions/jgit/build/docs/javadoc/. extensions/jgit/docs/api/javadoc/

      - name: Build documentation site
        run: mkdocs build --strict --config-file extensions/jgit/mkdocs.yml --site-dir public

      - name: Add generated Javadocs to Pages artifact
        run: |
          mkdir -p public/api/javadoc
          cp -R extensions/jgit/build/docs/javadoc/. public/api/javadoc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
